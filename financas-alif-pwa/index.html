    }
    Modals.close(); scheduleSave(); showToast("Empréstimo registrado ✓");
    UI.page="pessoa"; UI.pessoaSel=pessoaId; render();
  },
  pagarDoDia: function(empId, tipo, ref){
    if(tipo==="juros"){ pagarJurosEmprestimo(empId, ref); showToast("Juros recebido ✓"); }
    else { pagarParcelaEmprestimo(empId, Number(ref)); showToast("Parcela recebida ✓"); }
    render(); scheduleSave();
  },
  desfazerRecebimentoDia: function(empId, tipo, ref){
    if(tipo==="juros") desfazerJurosEmprestimo(empId, ref);
    else desfazerParcelaEmprestimo(empId, Number(ref));
    render(); scheduleSave(); showToast("Pagamento desfeito");
  },
  quitarDoDia: function(empId, tipo, ref){
    var e = STATE.emprestimos.find(function(x){return x.id===empId;});
    if(!e) return;
    var total = valorQuitarTudo(e, ref);
    UI.confirm = { tipo:"quitarDoDia", args:[empId, tipo, ref], positivo:true, label:"Sim, quitou",
      mensagem: pessoaNome(e.pessoaId)+" pagou tudo? Vai registrar "+fmtBRL(total)+(tipo==="juros"?" (principal + juro do mês)":" (todas as parcelas que faltavam)")+" como recebido hoje e o empréstimo fica quitado." };
    render();
  },
  pagarParcelaEmp: function(empId, numero){ pagarParcelaEmprestimo(empId, numero); render(); scheduleSave(); showToast("Recebimento registrado ✓"); },
  pagarJurosEmp: function(empId, mesAno){ pagarJurosEmprestimo(empId, mesAno); render(); scheduleSave(); showToast("Juro recebido ✓"); },
  toggleJurosDataPick: function(mesAno){ UI.jurosDatePickFor = (UI.jurosDatePickFor===mesAno ? null : mesAno); render(); },
  pagarJurosEmpComData: function(empId, mesAno){
    var input = document.getElementById("f_juros_data_"+mesAno);
    var data = (input && input.value) ? input.value : todayISO();
    pagarJurosEmprestimoComData(empId, mesAno, data);
    UI.jurosDatePickFor = null;
    render(); scheduleSave(); showToast("Juro recebido ✓");
  },
  excluirJurosOcorrencia: function(empId, mesAno){
    UI.confirm = { tipo:"excluirJurosOcorrencia", args:[empId,mesAno], mensagem:"Excluir este juro mensal? Essa ação não pode ser desfeita.", label:"Excluir" };
    render();
  },
  excluirTodosJurosPendentes: function(empId){
    UI.confirm = { tipo:"excluirTodosJurosPendentes", args:[empId], mensagem:"Excluir todas as parcelas de juros pendentes deste empréstimo? Os juros já pagos ficam no histórico, e novos juros mensais deixam de ser gerados.", label:"Excluir" };
    render();
  },
  excluirParcelaEmp: function(empId, numero){
    UI.confirm = { tipo:"excluirParcelaEmp", args:[empId,numero], mensagem:"Excluir esta parcela do empréstimo? Essa ação não pode ser desfeita.", label:"Excluir" };
    render();
  },
  excluirTodasParcelasEmp: function(empId){
    UI.confirm = { tipo:"excluirTodasParcelasEmp", args:[empId], mensagem:"Excluir todas as parcelas deste empréstimo? Como não sobra nenhuma parcela, o empréstimo inteiro será removido.", label:"Excluir tudo" };
    render();
  },
  toggleSelecaoParcelas: function(empId, tipo){
    if(UI.selecaoParcelas && UI.selecaoParcelas.empId===empId){
      UI.selecaoParcelas = null;
    } else {
      UI.selecaoParcelas = { empId:empId, tipo:tipo, ids:[] };
    }
    render();
  },
  toggleItemSelecionado: function(id){
    var s = UI.selecaoParcelas;
    if(!s) return;
    var idx = s.ids.indexOf(id);
    if(idx===-1) s.ids.push(id); else s.ids.splice(idx,1);
    render();
  },
  excluirSelecionadas: function(empId, tipo){
    var s = UI.selecaoParcelas;
    if(!s || !s.ids.length) return;
    var n = s.ids.length;
    UI.confirm = { tipo: tipo==="juros" ? "excluirJurosSelecionados" : "excluirParcelasSelecionadas",
      args:[empId, s.ids.slice()],
      mensagem:"Excluir "+n+" parcela"+(n===1?"":"s")+" selecionada"+(n===1?"":"s")+"? Essa ação não pode ser desfeita.",
      label:"Excluir "+n };
    render();
  },
  quitarEmprestimoJuros: function(empId){
    var data = document.getElementById("f_data_quitacao").value || todayISO();
    var obs = document.getElementById("f_obs_quitacao").value.trim();
    quitarEmprestimoJuros(empId, {data:data, observacao:obs});
    Modals.close(); scheduleSave(); showToast("Empréstimo quitado ✓");
  },
  confirmarVenda: function(empId){
    var comprador = document.getElementById("f_comprador").value.trim();
    var valor = parseFloat(document.getElementById("f_valor_venda").value);
    var data = document.getElementById("f_data_venda").value || todayISO();
    var obs = document.getElementById("f_obs_venda").value.trim();
    if(!comprador || !valor || valor<=0){ showToast("Preencha comprador e valor da venda."); return; }
    venderRecebivel(empId, {compradorNome:comprador, valorVenda:valor, data:data, observacao:obs});
    Modals.close(); scheduleSave(); showToast("Recebível transferido ✓");
  },
  excluirEmprestimo: function(empId){
    var e = STATE.emprestimos.find(function(x){return x.id===empId;});
    if(!e) return;
    UI.confirm = { tipo:"excluirEmprestimo", args:[empId], mensagem:"Excluir o empréstimo de "+pessoaNome(e.pessoaId)+"? Essa ação não pode ser desfeita.", label:"Excluir" };
    render();
  },
  cancelarConfirmacao: function(){ UI.confirm = null; render(); },
  confirmarAcaoPendente: function(){
    var c = UI.confirm;
    UI.confirm = null;
    if(!c){ render(); return; }
    if(c.tipo==="excluirSaida"){
      excluirSaidaItem(c.args[0],c.args[1],c.args[2]);
      Modals.close(); scheduleSave(); showToast("Transação excluída");
    } else if(c.tipo==="excluirEmprestimo"){
      STATE.emprestimos = STATE.emprestimos.filter(function(x){return x.id!==c.args[0];});
      Modals.close(); scheduleSave(); showToast("Empréstimo excluído");
    } else if(c.tipo==="excluirJurosOcorrencia"){
      excluirJurosOcorrencia(c.args[0], c.args[1]);
      render(); scheduleSave(); showToast("Juro excluído");
    } else if(c.tipo==="excluirTodosJurosPendentes"){
      excluirTodosJurosPendentes(c.args[0]);
      render(); scheduleSave(); showToast("Parcelas de juros pendentes excluídas");
    } else if(c.tipo==="excluirParcelaEmp"){
      excluirParcelaEmprestimo(c.args[0], c.args[1]);
      var aindaExiste = STATE.emprestimos.some(function(x){return x.id===c.args[0];});
      if(!aindaExiste) Modals.close();
      render(); scheduleSave(); showToast("Parcela excluída");
    } else if(c.tipo==="excluirTodasParcelasEmp"){
      excluirTodasParcelasEmprestimo(c.args[0]);
      Modals.close(); scheduleSave(); showToast("Empréstimo excluído");
    } else if(c.tipo==="excluirParcelasSelecionadas"){
      excluirParcelasEmprestimoMultiplas(c.args[0], c.args[1]);
      UI.selecaoParcelas = null;
      var aindaExisteM = STATE.emprestimos.some(function(x){return x.id===c.args[0];});
      if(!aindaExisteM) Modals.close();
      render(); scheduleSave(); showToast("Parcelas excluídas");
    } else if(c.tipo==="excluirJurosSelecionados"){
      excluirJurosOcorrenciasMultiplas(c.args[0], c.args[1]);
      UI.selecaoParcelas = null;
      render(); scheduleSave(); showToast("Juros excluídos");
    } else if(c.tipo==="quitarDoDia"){
      if(c.args[1]==="juros") quitarEmprestimoJuros(c.args[0], {data:todayISO(), mesAno:c.args[2]});
      else quitarEmprestimoParcelado(c.args[0], todayISO());
      render(); scheduleSave(); showToast("Empréstimo quitado ✓");
    } else if(c.tipo==="resetTudo"){
      try{ localStorage.removeItem("financas-alif-state"); }catch(ex){}
      var nome = STATE.perfil.nome;
      STATE = defaultState();
      STATE.perfil.nome = nome;
      ensureAllGenerated();
      UI.page = "dashboard"; UI.pessoaSel = null;
      render(); scheduleSave();
      showToast("Todos os dados foram apagados");
    } else if(c.tipo==="importarDados"){
      STATE = c.args[0];
      if(!STATE.eventosHistorico) STATE.eventosHistorico = [];
      if(!STATE.compromissos) STATE.compromissos = [];
      if(!STATE.categoriasEntradaExtras) STATE.categoriasEntradaExtras = [];
      if(!STATE.categoriasSaidaExtras) STATE.categoriasSaidaExtras = [];
      if(!STATE.perfil.tema) STATE.perfil.tema = "sistema";
      if(STATE.perfil.ocultarValores===undefined) STATE.perfil.ocultarValores = false;
      ensureAllGenerated();
      UI.page = "dashboard"; UI.pessoaSel = null;
      render(); scheduleSave();
      showToast("Dados importados com sucesso");
    } else {
      render();
    }
  },
  salvarPerfil: function(){
    var nome = document.getElementById("f_nome_perfil").value.trim();
    if(!nome){ showToast("Informe um nome."); return; }
    STATE.perfil.nome = nome; Modals.close(); scheduleSave(); showToast("Perfil atualizado");
  },
  salvarCompromisso: function(){
    var titulo = document.getElementById("f_titulo_cmp").value.trim();
    var data = document.getElementById("f_data_cmp").value || todayISO();
    var hora = document.getElementById("f_hora_cmp").value || "";
    var obs = document.getElementById("f_obs_cmp").value.trim();
    if(!titulo){ showToast("Informe um título."); return; }
    addCompromisso({titulo:titulo, data:data, hora:hora, observacao:obs});
    Modals.close(); scheduleSave(); showToast("Compromisso salvo ✓");
  },
  excluirCompromisso: function(id){
    excluirCompromisso(id);
    Modals.close(); scheduleSave(); showToast("Compromisso excluído");
  },
  setTema: function(tema){
    STATE.perfil.tema = tema;
    aplicarTema();
    render(); scheduleSave();
  },
  toggleOcultarValores: function(){
    STATE.perfil.ocultarValores = !STATE.perfil.ocultarValores;
    render(); scheduleSave();
  },
  apagarTodosDados: function(){
    UI.confirm = { tipo:"resetTudo", args:[], mensagem:"Apagar TODOS os dados (entradas, saídas, empréstimos, histórico)? Essa ação não pode ser desfeita.", label:"Apagar tudo" };
    render();
  },
  exportarDados: function(){
    var json = JSON.stringify(STATE, null, 2);
    var d = new Date();
    var pad = function(n){ return n<10 ? "0"+n : ""+n; };
    var fname = "financas-alif-backup-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(dl){
        if(!dl){ fallbackDownload(json, fname); return; }
        dl.save({ filename: fname, data: json }).then(function(){
          showToast("Backup salvo!");
        }).catch(function(err){
          if(err && err.code==="declined") return;
          fallbackDownload(json, fname);
        });
      }).catch(function(){ fallbackDownload(json, fname); });
    } else {
      fallbackDownload(json, fname);
    }
  },
  processarImportacao: function(input){
    var file = input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{ parsed = JSON.parse(e.target.result); }catch(err){ showToast("Arquivo inválido"); return; }
      if(!parsed || !parsed.perfil){ showToast("Arquivo não reconhecido como backup do app"); return; }
      UI.confirm = { tipo:"importarDados", args:[parsed], mensagem:"Importar este backup vai SUBSTITUIR todos os dados atuais neste dispositivo. Continuar?", label:"Importar" };
      render();
    };
    reader.onerror = function(){ showToast("Não foi possível ler o arquivo"); };
    reader.readAsText(file);
    input.value = "";
  }
};
function fallbackDownload(text, filename){
  try{
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Backup baixado!");
  }catch(e){
    showToast("Não foi possível gerar o arquivo de backup");
  }
}
window.Forms.togglePessoaNova = function(sel){
  var wrap = document.getElementById("f_pessoa_nome_wrap");
  wrap.style.display = sel.value==="__novo__" ? "block" : "none";
};


/* ============================== INIT ============================== */
function loadInitialState(){
  var el = document.getElementById("state-data");
  var raw = null;
  try{ raw = JSON.parse(el.textContent); }catch(e){ raw = null; }
  if(!raw || !raw.perfil){
    try{ var ls = localStorage.getItem("financas-alif-state"); if(ls) raw = JSON.parse(ls); }catch(e2){}
  }
  STATE = raw && raw.perfil ? raw : defaultState();
  if(!STATE.eventosHistorico) STATE.eventosHistorico = [];
  if(!STATE.compromissos) STATE.compromissos = [];
  if(!STATE.categoriasEntradaExtras) STATE.categoriasEntradaExtras = [];
  if(!STATE.categoriasSaidaExtras) STATE.categoriasSaidaExtras = [];
  if(!STATE.perfil.tema) STATE.perfil.tema = "sistema";
  if(STATE.perfil.ocultarValores===undefined) STATE.perfil.ocultarValores = false;
}

function aplicarTema(){
  var root = document.documentElement;
  var tema = STATE.perfil.tema;
  if(tema==="claro") root.setAttribute("data-theme","light");
  else if(tema==="escuro") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme");
}

function init(){
  HEAD_HTML = document.head.outerHTML;
  OWN_SCRIPT_OUTER = document.currentScript.outerHTML;
  loadInitialState();
  ensureAllGenerated();
  aplicarTema();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      claudeArtifact = ns;
      saveMode = ns ? "cloud" : "local";
      renderSaveBadge();
    }).catch(function(){ saveMode = "local"; renderSaveBadge(); });
  } else {
    saveMode = "local";
  }

  render();

  setTimeout(function(){
    var sp = document.getElementById("splash");
    if(!sp) return;
    sp.classList.add("hide");
    setTimeout(function(){ sp.remove(); }, 500);
  }, 4000);
}

init();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); });
