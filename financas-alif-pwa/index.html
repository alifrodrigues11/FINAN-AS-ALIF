  --info:#3169b0;

  }
}

*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);}
button,input,select,textarea{font-family:inherit;}

.topbar{padding:18px 16px 8px;}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.greet{display:flex;align-items:center;gap:8px;}
.skull{font-size:20px;}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-0.01em;}
.sub{margin:4px 0 0;color:var(--ink-muted);font-size:13px;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
main{padding:4px 16px 12px;}
.section{margin-top:18px;}
.section:first-child{margin-top:0;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px;}
h2{font-size:15px;margin:0;font-weight:800;}
.link{background:none;border:none;color:var(--info);font-size:13px;font-weight:700;cursor:pointer;padding:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat .label{font-size:12px;color:var(--ink-muted);font-weight:700;margin-bottom:6px;}
.stat .value{font-size:17px;font-weight:800;}
.stat.pos .value{color:var(--accent-strong);}
.stat.neg .value{color:var(--critical);}
.stat-sub{font-size:11px;font-weight:600;color:var(--ink-muted);margin-top:3px;}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--ink-muted);text-transform:uppercase;}
.hr{height:1px;background:var(--border);margin:28px 0 20px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--ink-muted);padding:2px 0 6px;}
.cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:8px;cursor:pointer;}
.cal-day:not(.empty):hover{background:var(--surface-alt);}
.cal-day.empty{cursor:default;}
.cal-num{font-size:11.5px;color:var(--ink);}
.cal-day.today .cal-num{background:var(--ink);color:var(--bg);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;}
.cal-dots{display:flex;gap:2px;height:4px;}
.cal-dots i{width:4px;height:4px;border-radius:50%;display:inline-block;}
.insight{background:var(--surface-alt);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:8px;}
.insight b{color:var(--accent-strong);}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.kpi-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kpi-line:last-child{border-bottom:none;}
.kpi-line .v{font-weight:800;text-align:right;}
.num{font-variant-numeric:tabular-nums;}
.empty{color:var(--ink-muted);font-size:13px;padding:14px;text-align:center;background:var(--surface-alt);border-radius:12px;}
.list{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px 12px;cursor:pointer;}
.emoji{width:36px;height:36px;border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-strong);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;}
.info{flex:1;min-width:0;}
.title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.amt{font-weight:800;font-size:13.5px;flex:none;}
.amt.in{color:var(--accent-strong);}
.amt.out{color:var(--critical);}
.backbtn{background:none;border:none;color:var(--info);font-weight:700;font-size:13px;padding:0 0 12px;cursor:pointer;}
.btn-row{display:flex;gap:10px;}
.btn{flex:1;border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer;text-align:center;}
.btn-primary{background:var(--ink);color:var(--bg);}
.btn-secondary{background:var(--surface-alt);color:var(--ink);border:1px solid var(--border);}
.btn-danger{background:rgba(162,59,46,0.12);color:var(--critical);}
.btn-ghost{background:none;color:var(--ink-muted);}
.btn-sm{padding:8px 10px;font-size:12.5px;flex:none;}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--ink-muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.pill.good{background:rgba(30,143,90,.14);color:var(--accent-strong);}
.pill.info{background:rgba(49,105,176,.14);color:var(--info);}
.pill.warn{background:rgba(193,134,27,.16);color:var(--warn);}
.pill.crit{background:rgba(162,59,46,.14);color:var(--critical);}
.pill.neutral{background:var(--surface-alt);color:var(--ink-muted);}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
.colgroup{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;}
.bar{width:9px;border-radius:3px 3px 0 0;}
.bar.in{background:var(--info);}
.bar.out{background:var(--warn);}
.xl{font-size:10.5px;color:var(--ink-muted);}
.legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--ink-muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.barlist{display:flex;flex-direction:column;gap:10px;}
.bl-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.bl-track{height:6px;border-radius:3px;background:var(--surface-alt);overflow:hidden;}
.bl-fill{height:100%;background:var(--accent-strong);border-radius:3px;}
.muted{color:var(--ink-muted);}
.small{font-size:12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14.5px;color:var(--ink);}
.field textarea{min-height:64px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.segmented{display:flex;background:var(--surface-alt);border-radius:10px;padding:3px;gap:3px;}

.hint{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 16px 20px;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:2px auto 14px;}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800;}
.sheet-sub{font-size:13px;color:var(--ink-muted);margin-bottom:16px;}
.form-scroll{max-height:56vh;overflow-y:auto;padding-right:2px;margin-bottom:14px;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:10px 4px;font-size:10.5px;font-weight:700;color:var(--ink-muted);cursor:pointer;}
.catbtn .e{font-size:18px;}
.catbtn.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.radio-cards{display:flex;flex-direction:column;gap:10px;}
.radio-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;}
.radio-card .t{font-weight:800;font-size:14px;margin-bottom:3px;}
.radio-card .d{font-size:12px;color:var(--ink-muted);}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;}
.save-banner{position:fixed;right:14px;bottom:96px;font-size:10.5px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--border);padding:4px 9px;border-radius:999px;z-index:40;}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg) 60%, transparent);z-index:45;}
.tabbar-inner{width:100%;max-width:480px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 10px;box-shadow:0 8px 24px rgba(20,20,19,.10);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-muted);font-size:10.5px;font-weight:700;padding:4px 2px;cursor:pointer;border-radius:10px;}
.tab .ic{font-size:18px;}
.tab.active{color:var(--accent-strong);}
.fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(20,20,19,.25);cursor:pointer;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

<body>
<div id="root"></div>
<script>
(function(){
"use strict";

/* ============================== CONSTANTS ============================== */
var MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var MESES_ABR = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

var CAT_ENTRADA = [
  {id:"salario", emoji:"💼", label:"Salário"},
  {id:"extra", emoji:"💵", label:"Renda extra / Bico"},
  {id:"outros", emoji:"💰", label:"Outros"}
];
var CAT_SAIDA = [
  {id:"aluguel", emoji:"🏠", label:"Aluguel"},
  {id:"carro", emoji:"🚗", label:"Carro"},
  {id:"agua", emoji:"💧", label:"Água"},
  {id:"luz", emoji:"💡", label:"Luz"},
  {id:"internet", emoji:"🌐", label:"Internet"},
  {id:"telefone", emoji:"📱", label:"Telefone"},
  {id:"alimentacao", emoji:"🛒", label:"Alimentação"},
  {id:"combustivel", emoji:"⛽", label:"Combustível"},
  {id:"saude", emoji:"🏥", label:"Saúde"},
  {id:"educacao", emoji:"🎓", label:"Educação"},
  {id:"compras", emoji:"🛍️", label:"Compras"},
  {id:"cartao", emoji:"💳", label:"Cartão de crédito"},
  {id:"outras", emoji:"📄", label:"Outras despesas"}
];
var JUROS_RAPIDOS = [0,10,15,20,30];

/* ============================== STATE ============================== */
var STATE = null;
var UI = { page:"dashboard", modal:null, modalData:null, histAno:null, histMes:null, anoSel:null, relatorioPeriodo:"mes", pessoaSel:null, planMes:null, calMes:null, toast:null, confirm:null, jurosDatePickFor:null };

function defaultState(){
  var y = new Date().getFullYear();
  return {
    perfil:{ nome:"ALIF", moeda:"BRL", criadoEm: todayISO(), tema:"sistema", ocultarValores:false },
    categoriasEntradaExtras: [],
    categoriasSaidaExtras: [],
    pessoas: [],
    entradas: [],
    rendaFixa: null,
    saidasUnicas: [],
    saidasParceladas: [],
    saidasRecorrentes: [],
    emprestimos: [],
    eventosHistorico: [],
    compromissos: [],
    horizonteMesAno: monthKeyFromParts(y, new Date().getMonth())
  };
}

/* ============================== UTIL ============================== */
function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ s=(s===undefined||s===null)?"":String(s); return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function attr(s){ return esc(s).replace(/`/g,"&#96;"); }
function fmtBRL(n){ if(STATE && STATE.perfil && STATE.perfil.ocultarValores) return "R$ ••••"; n = Number(n)||0; return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10?"0"+n:""+n; }
function monthKeyFromParts(y,mIdx){ return y+"-"+pad(mIdx+1); }
function monthKey(dateISO){ return dateISO ? dateISO.slice(0,7) : null; }
function monthLabel(mk){ if(!mk) return ""; var p=mk.split("-"); return MESES[parseInt(p[1],10)-1]+"/"+p[0]; }
function monthLabelShort(mk){ var p=mk.split("-"); return MESES_ABR[parseInt(p[1],10)-1]+"/"+p[0].slice(2); }
function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function addMonthsToKey(mk,n){ var p=mk.split("-").map(Number); var d=new Date(p[0],p[1]-1+n,1); return monthKeyFromParts(d.getFullYear(),d.getMonth()); }
function monthDiff(a,b){ var pa=a.split("-").map(Number), pb=b.split("-").map(Number); return (pb[0]-pa[0])*12+(pb[1]-pa[1]); }
function cmpKey(a,b){ return a<b?-1:(a>b?1:0); }
function dateFromMesAnoDia(mesAno, dia){
  var p=mesAno.split("-").map(Number);
  var lastDay = new Date(p[0], p[1], 0).getDate();
  var d = Math.min(dia||1, lastDay);
  return mesAno+"-"+pad(d);
}
function dayOf(iso){ return iso ? parseInt(iso.split("-")[2],10) : 1; }
function currentMesAno(){ return monthKey(todayISO()); }
function catInfoSaida(id){ var extra=STATE.categoriasSaidaExtras.find(function(c){return c.id===id;}); if(extra) return extra; return CAT_SAIDA.find(function(c){return c.id===id;}) || {id:id,emoji:"📄",label:id||"Outros"}; }
function catInfoEntrada(id){ var extra=STATE.categoriasEntradaExtras.find(function(c){return c.id===id;}); if(extra) return extra; return CAT_ENTRADA.find(function(c){return c.id===id;}) || {id:id,emoji:"💰",label:id||"Outros"}; }
function pessoaNome(id){ var p=STATE.pessoas.find(function(x){return x.id===id;}); return p?p.nome:"—"; }

/* ============================== GERAÇÃO / HORIZONTE ============================== */
function horizonAlvo(){ return addMonthsToKey(currentMesAno(), 15); }

function valorEfetivo(base, alteracoes, mesAno){
  var v = base;
  var melhor = null;
  (alteracoes||[]).forEach(function(a){
    if(cmpKey(a.apartirMesAno, mesAno) <= 0){
      if(!melhor || cmpKey(a.apartirMesAno, melhor.apartirMesAno) > 0) melhor = a;
    }
  });
  return melhor ? melhor.valor : v;
}

function ensureRendaFixa(){
  var rf = STATE.rendaFixa;
  if(!rf || !rf.ativa) return;
  if(!rf.excluidas) rf.excluidas = [];
  var alvo = horizonAlvo();
  var cursor = rf.inicioMesAno;
  var existentes = {};
  STATE.entradas.forEach(function(e){ if(e.origem==="fixa" && e.rendaFixaId===rf.id) existentes[e.mesAno]=e; });
  while(cmpKey(cursor, alvo) <= 0){
    if(rf.fimMesAno && cmpKey(cursor, rf.fimMesAno) > 0) break;
    if(!existentes[cursor] && rf.excluidas.indexOf(cursor)===-1){
      var valor = valorEfetivo(rf.valorBase, rf.alteracoes, cursor);
      STATE.entradas.push({
        id: uid("ent"), tipo:"salario", categoria:"salario", origem:"fixa", rendaFixaId: rf.id,
        mesAno: cursor, valor: valor, descricao: rf.descricao || "Salário",
        data: dateFromMesAnoDia(cursor, rf.diaRecebimento), observacao:""
      });
    }
    cursor = addMonthsToKey(cursor,1);
  }
}

function ensureSaidaRecorrente(rec){
  if(!rec.ativa) return;
  if(!rec.excluidas) rec.excluidas = [];
  var alvo = horizonAlvo();
  var cursor = rec.inicioMesAno;
  var existentes = {};
  (rec.ocorrencias||[]).forEach(function(o){ existentes[o.mesAno]=o; });
  while(cmpKey(cursor, alvo) <= 0){
    if(rec.encerradaApartirMesAno && cmpKey(cursor, rec.encerradaApartirMesAno) >= 0) break;
    if(!existentes[cursor] && rec.excluidas.indexOf(cursor)===-1){
      var valor = valorEfetivo(rec.valorBase, rec.alteracoes, cursor);
      rec.ocorrencias.push({
        mesAno: cursor, valor: valor, vencimento: dateFromMesAnoDia(cursor, rec.diaVencimento),
        status:"pendente", dataPagamento:null
      });
    }
    cursor = addMonthsToKey(cursor,1);
  }
  rec.ocorrencias.sort(function(a,b){ return cmpKey(a.mesAno,b.mesAno); });
}

function ensureJurosEmprestimo(emp){
  if(!emp.ativa) return;
  if(emp.jurosPausado) return;
  var alvo = horizonAlvo();
  var cursor = emp.inicioMesAno;
  var existentes = {};
  (emp.jurosOcorrencias||[]).forEach(function(o){ existentes[o.mesAno]=o; });
  var excluidas = emp.jurosExcluidas||[];
  var limite = emp.qtdParcelasJuros || null;
  var contados = Object.keys(existentes).length + excluidas.filter(function(mk){ return !existentes[mk]; }).length;
  while(cmpKey(cursor, alvo) <= 0){
    if(limite && contados >= limite) break;
    if(!existentes[cursor] && excluidas.indexOf(cursor)===-1){
      emp.jurosOcorrencias.push({
        mesAno: cursor, valor: emp.jurosMensal, vencimento: dateFromMesAnoDia(cursor, emp.diaVencimento),
        status:"pendente", dataPagamento:null
      });
      contados++;
    }
    cursor = addMonthsToKey(cursor,1);
  }
  emp.jurosOcorrencias.sort(function(a,b){ return cmpKey(a.mesAno,b.mesAno); });
}

function ensureAllGenerated(){
  ensureRendaFixa();
  STATE.saidasRecorrentes.forEach(ensureSaidaRecorrente);
  STATE.emprestimos.filter(function(e){return e.tipoCobranca==="juros";}).forEach(ensureJurosEmprestimo);
  STATE.horizonteMesAno = horizonAlvo();
}

/* ============================== LISTAS NORMALIZADAS ============================== */
function todasEntradas(){
  return STATE.entradas.slice().sort(function(a,b){ return cmpKey(b.data,a.data); });
}
function todasSaidasFlat(){
  var out = [];
  STATE.saidasUnicas.forEach(function(s){
    out.push({ id:s.id, kind:"unica", parentId:s.id, nome:s.descricao, categoria:s.categoria, valor:s.valor,
      vencimento:s.vencimento, dataPagamento:s.dataPagamento, status:s.status, observacao:s.observacao, parcelaLabel:null });
  });
  STATE.saidasParceladas.forEach(function(p){
    p.parcelas.forEach(function(pc){
      out.push({ id:p.id+"_"+pc.numero, kind:"parcelada", parentId:p.id, nome:p.nome, categoria:p.categoria, valor:pc.valor,
        vencimento:pc.vencimento, dataPagamento:pc.dataPagamento, status:pc.status, observacao:p.observacao,
        parcelaLabel:"Parcela "+pc.numero+"/"+p.qtdParcelas, numero:pc.numero });
    });
  });
  STATE.saidasRecorrentes.forEach(function(r){
    r.ocorrencias.forEach(function(o){
      out.push({ id:r.id+"_"+o.mesAno, kind:"recorrente", parentId:r.id, nome:r.nome, categoria:r.categoria, valor:o.valor,
        vencimento:o.vencimento, dataPagamento:o.dataPagamento, status:o.status, observacao:"", parcelaLabel:"Recorrente", mesAno:o.mesAno });

function effStatus(item){
  if(item.status==="pago" || item.status==="cancelado") return item.status;
  var hoje = todayISO();
  if(item.vencimento < hoje) return "atrasado";
  var diff = (new Date(item.vencimento) - new Date(hoje))/86400000;
  if(diff <= 5) return "proximo";
  return "pendente";
}

function totalRecebidoEmprestimos(){
  var s=0;
  STATE.emprestimos.forEach(function(e){
    if(e.tipoCobranca==="juros"){
      e.jurosOcorrencias.forEach(function(o){ if(o.status==="pago") s+=o.valor; });
      if(e.quitacao) s += e.quitacao.valorPrincipal;
      return;
    }
    e.parcelas.forEach(function(p){ if(p.status==="pago") s+=p.valor; });
  });
  return s;
}
function totalJurosRecebidos(){
  var s=0;
  STATE.emprestimos.forEach(function(e){
    if(e.tipoCobranca==="juros"){
      e.jurosOcorrencias.forEach(function(o){ if(o.status==="pago") s+=o.valor; });
      return;
    }
    var frac = e.valorTotal ? (e.valorJuros/e.valorTotal) : 0;
    e.parcelas.forEach(function(p){ if(p.status==="pago") s += p.valor*frac; });
  });

}

function saldoAtual(){
  var hoje = todayISO();
  var recebido = STATE.entradas.filter(function(e){return e.data<=hoje;}).reduce(function(s,e){return s+e.valor;},0);
  var pago = todasSaidasFlat().filter(function(s){return s.status==="pago";}).reduce(function(s,x){return s+x.valor;},0);
  return recebido - pago;
}
function saldoLiquidoEmprestimos(){
  var hoje = todayISO();
  var emprestado = STATE.emprestimos.filter(function(e){return e.dataEmprestimo<=hoje;}).reduce(function(s,e){return s+e.valorOriginal;},0);
  return totalRecebidoEmprestimos() + totalVendido() - emprestado;
}
function saldoPrevistoFimMes(){
  var mk = currentMesAno();
  var hoje = todayISO();
  var atual = saldoAtual();
  var entradasFuturas = STATE.entradas.filter(function(e){ return monthKey(e.data)===mk && e.data>hoje; }).reduce(function(s,e){return s+e.valor;},0);
  var saidasFuturas = todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && s.vencimento>hoje && s.status!=="pago" && s.status!=="cancelado"; }).reduce(function(s,x){return s+x.valor;},0);
  return atual + entradasFuturas - saidasFuturas;
}

function marcarStatusItem(kind, parentId, subId, novoStatus){
  var hoje = todayISO();
  if(kind==="unica"){
    var s = STATE.saidasUnicas.find(function(x){return x.id===parentId;});
    if(s){ s.status=novoStatus; s.dataPagamento = novoStatus==="pago"?hoje:null; }
  } else if(kind==="parcelada"){
    var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});
    if(p){ var pc = p.parcelas.find(function(x){return x.numero===Number(subId);}); if(pc){ pc.status=novoStatus; pc.dataPagamento=novoStatus==="pago"?hoje:null; } }
  } else if(kind==="recorrente"){
    var r = STATE.saidasRecorrentes.find(function(x){return x.id===parentId;});
    if(r){ var o = r.ocorrencias.find(function(x){return x.mesAno===subId;}); if(o){ o.status=novoStatus; o.dataPagamento=novoStatus==="pago"?hoje:null; } }
  }
}

  var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});

  p.parcelas.forEach(function(pc){ if(pc.numero>=apartirNumero && pc.status!=="pago") pc.status="cancelado"; });

function excluirSaidaItem(kind, parentId, subId){
  if(kind==="unica"){
    STATE.saidasUnicas = STATE.saidasUnicas.filter(function(x){return x.id!==parentId;});
  } else if(kind==="parcelada"){
    var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});
    if(!p) return;
    p.parcelas = p.parcelas.filter(function(pc){return pc.numero!==Number(subId);});
    if(p.parcelas.length===0){
      STATE.saidasParceladas = STATE.saidasParceladas.filter(function(x){return x.id!==parentId;});
    }
  } else if(kind==="recorrente"){
    var r = STATE.saidasRecorrentes.find(function(x){return x.id===parentId;});
    if(!r) return;
    r.ocorrencias = r.ocorrencias.filter(function(o){return o.mesAno!==subId;});
    if(!r.excluidas) r.excluidas = [];
    if(r.excluidas.indexOf(subId)===-1) r.excluidas.push(subId);
  }
}

function addEmprestimo(data){
  var tipoCobranca = data.tipoCobranca === "juros" ? "juros" : "parcelado";
  var dia = dayOf(data.primeiraDataPagamento);
  var mkInicial = monthKey(data.primeiraDataPagamento);

  if(tipoCobranca === "juros"){
    var jurosMensalVal = Math.round(data.valorOriginal * (data.juros/100) * 100)/100;
    var empJ = { id: uid("emp"), pessoaId:data.pessoaId, valorOriginal:data.valorOriginal, jurosPercent:data.juros,
      tipoCobranca:"juros", jurosMensal: jurosMensalVal, diaVencimento:dia, inicioMesAno:mkInicial,
      dataEmprestimo:data.dataEmprestimo, primeiraDataPagamento:data.primeiraDataPagamento,
      qtdParcelasJuros: data.qtdParcelasJuros || null, jurosExcluidas:[], jurosPausado:false,
      observacao:data.observacao||"", ativa:true, jurosOcorrencias:[], quitacao:null, status:"ativo", venda:null };
    STATE.emprestimos.push(empJ);
    ensureJurosEmprestimo(empJ);
    pushEvento("emprestimo", "Novo empréstimo (juros mensais) para "+pessoaNome(data.pessoaId), data.valorOriginal);
    return empJ;
  }

  var qtd = data.qtdParcelas || 1;
  var jurosModo = data.jurosModo === "mensal" ? "mensal" : "total";
  var mesesJuros = jurosModo === "mensal" ? qtd : 1;
  var jurosVal = data.valorOriginal * (data.juros/100) * mesesJuros;
  var total = data.valorOriginal + jurosVal;
  var valorParcelaBase = Math.round((total/qtd)*100)/100;
  var soma = 0, parcelas=[];
  for(var i=1;i<=qtd;i++){
    var v = (i===qtd) ? Math.round((total-soma)*100)/100 : valorParcelaBase;
    soma += v;
    parcelas.push({ numero:i, valor:v, vencimento: dateFromMesAnoDia(addMonthsToKey(mkInicial,i-1), dia), status:"pendente", dataPagamento:null });
  }
  var emp = { id: uid("emp"), pessoaId:data.pessoaId, valorOriginal:data.valorOriginal, jurosPercent:data.juros, jurosModo:jurosModo,
    tipoCobranca:"parcelado", valorJuros: Math.round(jurosVal*100)/100, valorTotal: Math.round(total*100)/100, dataEmprestimo:data.dataEmprestimo,
    qtdParcelas:qtd, frequencia:data.frequencia||"mensal", primeiraDataPagamento:data.primeiraDataPagamento,
    observacao:data.observacao||"", parcelas:parcelas, status:"ativo", venda:null };
  STATE.emprestimos.push(emp);
  pushEvento("emprestimo", "Novo empréstimo para "+pessoaNome(data.pessoaId), data.valorOriginal);
  return emp;
}
function pagarParcelaEmprestimo(empId, numero){

  if(!e) return;
  var p = e.parcelas.find(function(x){return x.numero===numero;});
  if(p){ p.status="pago"; p.dataPagamento=todayISO(); }
  if(e.parcelas.every(function(x){return x.status==="pago";})) e.status="quitado";
  pushEvento("recebimento", "Recebimento de "+pessoaNome(e.pessoaId)+" — parcela "+numero+"/"+e.qtdParcelas, p?p.valor:0);

function quitarEmprestimoJuros(empId, data){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return;
  var dataQ = data.data || todayISO();
  var mk = monthKey(dataQ);
  var ocorrenciaMes = e.jurosOcorrencias.find(function(o){return o.mesAno===mk;});
  if(ocorrenciaMes && ocorrenciaMes.status!=="pago"){ ocorrenciaMes.status="pago"; ocorrenciaMes.dataPagamento=dataQ; }
  e.ativa = false;
  e.status = "quitado";
  e.quitacao = { data:dataQ, valorPrincipal:e.valorOriginal, valorJurosIncluso: ocorrenciaMes?ocorrenciaMes.valor:0, observacao:data.observacao||"" };
  e.jurosOcorrencias = e.jurosOcorrencias.filter(function(o){ return o.status==="pago"; });
  pushEvento("quitacao", "Empréstimo de "+pessoaNome(e.pessoaId)+" quitado (principal"+(ocorrenciaMes?" + juros do mês":"")+")", e.valorOriginal + (ocorrenciaMes?ocorrenciaMes.valor:0));
}
function venderRecebivel(empId, data){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return;
  var restante = e.parcelas.filter(function(p){return p.status!=="pago";}).reduce(function(s,p){return s+p.valor;},0);
  e.venda = { compradorNome:data.compradorNome, valorVenda:data.valorVenda, data:data.data, observacao:data.observacao||"", valorRestanteNaVenda:restante };
  e.status = "vendido";
  pushEvento("venda", "Venda de recebível de "+pessoaNome(e.pessoaId)+" para "+data.compradorNome, data.valorVenda);
}
function statusEmprestimo(e){
  if(e.status==="vendido") return "vendido";
  if(e.tipoCobranca==="juros"){
    if(e.status==="quitado") return "quitado";
    var hojeJ=todayISO();
    if(e.jurosOcorrencias.some(function(o){return o.status!=="pago" && o.vencimento<hojeJ;})) return "atrasado";
    var proximaJ = e.jurosOcorrencias.filter(function(o){return o.status!=="pago";}).sort(function(a,b){return cmpKey(a.vencimento,b.vencimento);})[0];
    if(proximaJ){ var diffJ=(new Date(proximaJ.vencimento)-new Date(hojeJ))/86400000; if(diffJ<=5) return "proximo"; }
    return "em_dia";
  }
  if(e.parcelas.every(function(p){return p.status==="pago";})) return "quitado";
  var hoje=todayISO();
  if(e.parcelas.some(function(p){return p.status!=="pago" && p.vencimento<hoje;})) return "atrasado";
  var proxima = e.parcelas.filter(function(p){return p.status!=="pago";}).sort(function(a,b){return cmpKey(a.vencimento,b.vencimento);})[0];
  if(proxima){ var diff=(new Date(proxima.vencimento)-new Date(hoje))/86400000; if(diff<=5) return "proximo"; }
  return "em_dia";
}
function restanteEmprestimo(e){
  if(e.status==="vendido") return 0;
  if(e.tipoCobranca==="juros"){
    var s = e.jurosOcorrencias.filter(function(o){return o.status!=="pago";}).reduce(function(a,o){return a+o.valor;},0);
    if(e.status!=="quitado") s += e.valorOriginal;
    return s;
  }
  return e.parcelas.filter(function(x){return x.status!=="pago";}).reduce(function(a,x){return a+x.valor;},0);
}
function recebidoEmprestimo(e){
  if(e.tipoCobranca==="juros"){
    var s = e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).reduce(function(a,o){return a+o.valor;},0);
    if(e.quitacao) s += e.quitacao.valorPrincipal;
    return s;
  }
  return e.parcelas.filter(function(x){return x.status==="pago";}).reduce(function(a,x){return a+x.valor;},0);
}
function jurosTotalEmprestimo(e){
  if(e.tipoCobranca==="juros"){
    return e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).reduce(function(a,o){return a+o.valor;},0);
  }
  return e.valorJuros;
}

var claudeArtifact = null;
var saveTimer = null;
var saveMode = "checking";

function showToast(msg){ UI.toast = msg; render(); setTimeout(function(){ UI.toast=null; render(); }, 2200); }

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 260);
}
function doSave(){
  try{ localStorage.setItem("financas-alif-state", JSON.stringify(STATE)); }catch(e){}
  if(claudeArtifact){
    claudeArtifact.publish(buildFullHTML(STATE)).then(function(){
      saveMode = "cloud";
    }).catch(function(err){
      if(err && (err.code==="not_writer" || err.code==="not_granted" || err.code==="not_declared")){
        saveMode = "local";
      } else if(err && err.code==="conflict"){
        /* shell recarrega a view */
      } else {
        saveMode = "local";
      }
      renderSaveBadge();
    });
  }
}
function renderSaveBadge(){
  var el = document.getElementById("save-badge");
  if(el) el.textContent = saveMode==="cloud" ? "☁️ Salvo" : (saveMode==="local" ? "💾 Salvo neste dispositivo" : "…");

function calendarMiniHTML(mk){
  var p = mk.split("-").map(Number);
  var year = p[0], month = p[1];
  var firstDow = new Date(year, month-1, 1).getDay();
  var daysInMonth = new Date(year, month, 0).getDate();
  var hoje = todayISO();

  var dayInfo = {};
  todasSaidasFlat().forEach(function(s){ if(monthKey(s.vencimento)===mk && s.status!=="cancelado"){ var d=dayOf(s.vencimento); (dayInfo[d]=dayInfo[d]||{}).out=true; } });
  STATE.emprestimos.forEach(function(e){
    if(e.status==="vendido") return;
    if(e.tipoCobranca==="juros"){ e.jurosOcorrencias.forEach(function(o){ if(monthKey(o.vencimento)===mk && o.status!=="pago"){ var d=dayOf(o.vencimento); (dayInfo[d]=dayInfo[d]||{}).emp=true; } }); }
    else { e.parcelas.forEach(function(pc){ if(monthKey(pc.vencimento)===mk && pc.status!=="pago"){ var d=dayOf(pc.vencimento); (dayInfo[d]=dayInfo[d]||{}).emp=true; } }); }
  });
  compromissosDoMes(mk).forEach(function(c){ var d=dayOf(c.data); (dayInfo[d]=dayInfo[d]||{}).cmp=true; });

  var dow = ["D","S","T","Q","Q","S","S"];
  var html = '<div class="cal-grid">';
  dow.forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="cal-day empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = mk+"-"+pad(d);
    var info = dayInfo[d];
    var isToday = iso===hoje;
    html += '<div class="cal-day'+(isToday?" today":"")+'" onclick="Nav.calGoMes(\''+mk+'\')" title="'+fmtDate(iso)+'">'
      + '<span class="cal-num">'+d+'</span>';
    if(info){
      html += '<span class="cal-dots">'
        + (info.emp?'<i style="background:var(--accent-strong)"></i>':'')
        + (info.out?'<i style="background:var(--critical)"></i>':'')
        + (info.cmp?'<i style="background:var(--info)"></i>':'')
        + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================== HISTÓRICO ============================== */
function pageHistorico(){
  ensureAllGenerated();
  if(!UI.histAno) UI.histAno = new Date().getFullYear();
  var anos = anosDisponiveis();
  var ano = UI.histAno;
  var html = "";
  html += '<div class="section"><div class="chiprow">';
  anos.forEach(function(a){ html += '<button class="chip '+(a===ano?"active":"")+'" onclick="Nav.setHistAno('+a+')">'+a+'</button>'; });
  html += '</div></div>';

  var meses = [];
  for(var m=0;m<12;m++){
    var mk = monthKeyFromParts(ano,m);
    var r = resumoMes(mk);
    meses.push({mk:mk, idx:m, r:r});
  }
  var totalAno = meses.reduce(function(acc,x){ acc.e+=x.r.entradas; acc.s+=x.r.saidas; return acc; }, {e:0,s:0});

  html += '<div class="card section"><h2 style="margin-bottom:10px;">Resumo de '+ano+'</h2>';
  html += '<div class="kpi-line"><span>📈 Entradas no ano</span><span class="v num">'+fmtBRL(totalAno.e)+'</span></div>';
  html += '<div class="kpi-line"><span>📉 Saídas no ano</span><span class="v num">'+fmtBRL(totalAno.s)+'</span></div>';
  html += '<div class="kpi-line"><span>💰 Saldo do ano</span><span class="v num">'+fmtBRL(totalAno.e-totalAno.s)+'</span></div>';
  html += '</div>';

  html += '<div class="section"><div class="section-head"><h2>Mês a mês</h2></div><div class="tablewrap"><table>';
  html += '<tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr>';
  meses.forEach(function(x){
    var vazio = x.r.entradas===0 && x.r.saidas===0;
    html += '<tr style="cursor:pointer;'+(vazio?"opacity:.45":"")+'" onclick="Nav.verMesHistorico(\''+x.mk+'\')">'
      + '<td>'+MESES[x.idx]+'</td><td class="num">'+fmtBRL(x.r.entradas)+'</td><td class="num">'+fmtBRL(x.r.saidas)+'</td>'
      + '<td class="num" style="font-weight:800;color:'+(x.r.saldo>=0?"var(--accent-strong)":"var(--critical)")+'">'+fmtBRL(x.r.saldo)+'</td></tr>';
  });
  html += '</table></div></div>';

  if(UI.histMes){
    html += renderDetalheMes(UI.histMes);
  }
  return html;
}
function anosDisponiveis(){
  var set = {};
  var y = new Date().getFullYear();
  set[y]=1; set[y-1]=1; set[y+1]=1;
  STATE.entradas.forEach(function(e){ set[parseInt(e.data.slice(0,4),10)]=1; });
  todasSaidasFlat().forEach(function(s){ set[parseInt(s.vencimento.slice(0,4),10)]=1; });
  return Object.keys(set).map(Number).sort();
}
function renderDetalheMes(mk){
  var entradas = STATE.entradas.filter(function(e){return monthKey(e.data)===mk;});
  var saidas = todasSaidasFlat().filter(function(s){return monthKey(s.vencimento)===mk && s.status!=="cancelado";});
  var html = '<div class="section"><div class="section-head"><h2>'+monthLabel(mk)+' em detalhe</h2><button class="link" onclick="Nav.fecharMesHistorico()">Fechar</button></div>';
  html += '<div class="list">';
  entradas.forEach(function(e){ html += entradaRow(e); });
  saidas.forEach(function(s){ html += saidaRow(s); });
  if(entradas.length===0 && saidas.length===0) html += '<div class="empty">Sem movimentações neste mês.</div>';
  html += '</div></div>';
  return html;
}

/* ============================== CALENDÁRIO ============================== */
function pageCalendario(){
  ensureAllGenerated();
  if(!UI.calMes) UI.calMes = currentMesAno();
  var mk = UI.calMes;
  var html = '<div class="section"><div class="btn-row">'
    + '<button class="btn btn-secondary btn-sm" onclick="Nav.calNav(-1)">‹ Anterior</button>'
    + '<div class="btn btn-secondary btn-sm" style="flex:2;font-weight:800;">'+monthLabel(mk)+'</div>'
    + '<button class="btn btn-secondary btn-sm" onclick="Nav.calNav(1)">Próximo ›</button></div></div>';

  html += '<div class="section"><button class="btn btn-primary" onclick="Modals.open(\'novo-compromisso\')">+ Novo compromisso</button></div>';

  var eventos = {};
  STATE.entradas.filter(function(e){return monthKey(e.data)===mk;}).forEach(function(e){
    (eventos[e.data] = eventos[e.data]||[]).push({ic:"📥",t:esc(e.descricao||"Entrada"), v:fmtBRL(e.valor), pos:true});
  });
  todasSaidasFlat().filter(function(s){return monthKey(s.vencimento)===mk && s.status!=="cancelado";}).forEach(function(s){
    (eventos[s.vencimento] = eventos[s.vencimento]||[]).push({ic:"📤",t:esc(s.nome)+(s.parcelaLabel?" ("+s.parcelaLabel+")":""), v:fmtBRL(s.valor), pos:false});
  });
  STATE.emprestimos.forEach(function(e){
    if(e.status==="vendido") return;
    if(e.tipoCobranca==="juros"){
      e.jurosOcorrencias.forEach(function(o){ if(monthKey(o.vencimento)===mk && o.status!=="pago"){ (eventos[o.vencimento]=eventos[o.vencimento]||[]).push({ic:"🤝", t:"Juro de "+esc(pessoaNome(e.pessoaId)), v:fmtBRL(o.valor), pos:true}); } });
      return;
    }
    e.parcelas.forEach(function(p){ if(monthKey(p.vencimento)===mk && p.status!=="pago"){ (eventos[p.vencimento]=eventos[p.vencimento]||[]).push({ic:"🤝", t:"Receber de "+esc(pessoaNome(e.pessoaId)), v:fmtBRL(p.valor), pos:true}); } });
  });
  compromissosDoMes(mk).forEach(function(c){
    (eventos[c.data] = eventos[c.data]||[]).push({ic:"📌", t:esc(c.titulo), compromisso:true, id:c.id, hora:c.hora});
  });

  var dias = Object.keys(eventos).sort();
  html += '<div class="section"><div class="list">';
  if(dias.length===0){ html += '<div class="empty">Nenhum evento neste mês.</div>'; }
  dias.forEach(function(d){
    html += '<div class="card"><div style="font-weight:800;font-size:13px;margin-bottom:8px;">'+fmtDate(d)+'</div>';
    eventos[d].sort(function(a,b){ return (a.hora||"99:99") < (b.hora||"99:99") ? -1 : 1; }).forEach(function(ev){
      if(ev.compromisso){
        html += '<div class="kpi-line" style="cursor:pointer;" onclick="Modals.open(\'ver-compromisso\',\''+ev.id+'\')"><span>'+ev.ic+' '+ev.t+'</span><span class="v" style="color:var(--info);">'+(ev.hora?esc(ev.hora):"")+'</span></div>';
      } else {
        html += '<div class="kpi-line"><span>'+ev.ic+' '+ev.t+'</span><span class="v num" style="color:'+(ev.pos?"var(--accent-strong)":"var(--critical)")+'">'+(ev.pos?"+":"-")+ev.v+'</span></div>';
      }
    });
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ============================== RELATÓRIOS ============================== */
function pageRelatorios(){
  ensureAllGenerated();
  var mkAtual = currentMesAno();
  var meses = [];
  for(var i=5;i>=0;i--) meses.push(addMonthsToKey(mkAtual,-i));
  var maxVal = 1;
  var dados = meses.map(function(mk){ var r=resumoMes(mk); maxVal=Math.max(maxVal,r.entradas,r.saidas); return {mk:mk,r:r}; });

  var html = "";
  html += '<div class="section"><div class="card"><h2 style="margin-bottom:2px;">Entradas x Saídas (6 meses)</h2>';
  html += '<div class="chart">';
  dados.forEach(function(d){
    var hIn = Math.round((d.r.entradas/maxVal)*110)+2;
    var hOut = Math.round((d.r.saidas/maxVal)*110)+2;
    html += '<div class="colgroup"><div class="bars"><div class="bar in" style="height:'+hIn+'px" title="Entradas"></div><div class="bar out" style="height:'+hOut+'px" title="Saídas"></div></div><div class="xl">'+monthLabelShort(d.mk)+'</div></div>';
  });
  html += '</div><div class="legend"><span><i style="background:var(--info)"></i>Entradas</span><span><i style="background:var(--warn)"></i>Saídas</span></div></div></div>';

  var porCategoria = {};
  todasSaidasFlat().filter(function(s){return s.status!=="cancelado";}).forEach(function(s){ porCategoria[s.categoria]=(porCategoria[s.categoria]||0)+s.valor; });
  var catArr = Object.keys(porCategoria).map(function(k){ return {cat:k, v:porCategoria[k]}; }).sort(function(a,b){return b.v-a.v;});
  var maxCat = catArr.length? catArr[0].v : 1;
  html += '<div class="section"><div class="card"><h2 style="margin-bottom:10px;">Gastos por categoria (total)</h2>';
  if(catArr.length===0) html += '<div class="empty">Sem despesas registradas.</div>';
  else{
    html += '<div class="barlist">';
    catArr.slice(0,10).forEach(function(x){
      var c = catInfoSaida(x.cat);
      var pct = Math.round((x.v/maxCat)*100);
      html += '<div><div class="bl-head"><span>'+c.emoji+' '+c.label+'</span><span class="num" style="font-weight:700">'+fmtBRL(x.v)+'</span></div><div class="bl-track"><div class="bl-fill" style="width:'+pct+'%"></div></div></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';

  html += '<div class="section"><div class="card">';
  html += '<div class="kpi-line"><span>Total emprestado</span><span class="v num">'+fmtBRL(totalEmprestado())+'</span></div>';
  html += '<div class="kpi-line"><span>Total recebido em empréstimos</span><span class="v num">'+fmtBRL(totalRecebidoEmprestimos())+'</span></div>';
  html += '<div class="kpi-line"><span>Total de juros recebidos</span><span class="v num">'+fmtBRL(totalJurosRecebidos())+'</span></div>';
  html += '<div class="kpi-line"><span>Total a receber</span><span class="v num">'+fmtBRL(totalAReceberEmprestimos())+'</span></div>';
  var atrasados = STATE.emprestimos.filter(function(e){return statusEmprestimo(e)==="atrasado";}).length;
  html += '<div class="kpi-line"><span>Empréstimos atrasados</span><span class="v num">'+atrasados+'</span></div>';
  html += '<div class="kpi-line"><span>Valores vendidos/transferidos</span><span class="v num">'+fmtBRL(totalVendido())+'</span></div>';
  html += '</div></div>';
  return html;
}

  return html;
}

window.Forms = {
  pickCat: function(btn, name, id){
    var parent = btn.parentElement;
    Array.prototype.forEach.call(parent.querySelectorAll(".catbtn"), function(b){ b.classList.remove("sel"); });
    btn.classList.add("sel");
    document.getElementById("f_"+name).value = id;
  },
  pickJuros: function(btn, val){
    var parent = btn.parentElement;
    Array.prototype.forEach.call(parent.querySelectorAll(".chip"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("f_juros").value = val;
    document.getElementById("f_juros_custom").value = "";
    Forms.updateJurosPreview();
  },
  pickJurosModo: function(btn, modo){
    var parent = btn.parentElement;
    Array.prototype.forEach.call(parent.querySelectorAll("button"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("f_juros_modo").value = modo;
    var hint = document.getElementById("juros-modo-hint");
    if(hint){
      hint.textContent = modo==="mensal"
        ? "Juros incidem a cada mês até a última parcela (ex: 10% ao mês em 3 parcelas = 30% no total)."
        : "Juros incidem uma única vez sobre o valor emprestado, não importa o número de parcelas.";
    }
    Forms.updateJurosPreview();
  },
  pickTipoCobranca: function(btn, tipo){
    var parent = btn.parentElement;
    Array.prototype.forEach.call(parent.querySelectorAll("button"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("f_tipo_cobranca").value = tipo;
    var hint = document.getElementById("tipo-cobranca-hint");
    var jurosModoWrap = document.getElementById("juros-modo-wrap");
    var qtdWrap = document.getElementById("qtd-emp-wrap");
    var diaWrap = document.getElementById("dia-juros-wrap");
    var qtdJurosWrap = document.getElementById("qtd-juros-wrap");
    if(tipo==="juros"){
      if(hint) hint.textContent = "Ela paga só o juro todo mês; o valor emprestado (principal) você recebe de volta quando ela quitar.";
      if(jurosModoWrap) jurosModoWrap.style.display = "none";
      if(qtdWrap) qtdWrap.style.display = "none";
      if(diaWrap) diaWrap.style.display = "block";
      if(qtdJurosWrap) qtdJurosWrap.style.display = "block";
    } else {
      if(hint) hint.textContent = "Principal + juros divididos em parcelas iguais.";
      if(jurosModoWrap) jurosModoWrap.style.display = "block";
      if(qtdWrap) qtdWrap.style.display = "flex";
      if(diaWrap) diaWrap.style.display = "none";
      if(qtdJurosWrap) qtdJurosWrap.style.display = "none";
    }
    Forms.updateJurosPreview();
  },
  updateJurosPreview: function(){
    var box = document.getElementById("preview-juros");
    if(!box) return;
    var valor = parseFloat(document.getElementById("f_valor_emp").value) || 0;
    var custom = parseFloat(document.getElementById("f_juros_custom").value);
    var customStr = document.getElementById("f_juros_custom").value;
    var juros = !isNaN(custom) && customStr!=="" ? custom : (parseFloat(document.getElementById("f_juros").value)||0);
    var tipoCobranca = document.getElementById("f_tipo_cobranca").value;
    if(valor<=0){ box.innerHTML = ""; return; }

    if(tipoCobranca==="juros"){
      var jurosMes = valor * (juros/100);
      box.innerHTML = '<div class="kpi-line"><span>Juro mensal ('+juros+'%)</span><span class="v num">'+fmtBRL(jurosMes)+'/mês</span></div>'
        + '<div class="kpi-line"><span>Principal (recebido na quitação)</span><span class="v num">'+fmtBRL(valor)+'</span></div>'
        + '<div class="kpi-line"><span>Último pagamento (se quitar após 1 mês)</span><span class="v num">'+fmtBRL(valor+jurosMes)+'</span></div>';
      return;
    }

    var qtd = parseInt(document.getElementById("f_qtd_emp").value,10) || 1;
    var modo = document.getElementById("f_juros_modo").value;
    var meses = modo==="mensal" ? qtd : 1;
    var jurosVal = valor * (juros/100) * meses;
    var total = valor + jurosVal;
    var parcela = total/qtd;
    box.innerHTML = '<div class="kpi-line"><span>Juros'+(modo==="mensal" && qtd>1 ? " ("+juros+"% × "+qtd+" meses)" : "")+'</span><span class="v num">'+fmtBRL(jurosVal)+'</span></div>'
      + '<div class="kpi-line"><span>Total a receber</span><span class="v num">'+fmtBRL(total)+'</span></div>'
      + (qtd>1 ? '<div class="kpi-line"><span>Cada parcela</span><span class="v num">'+fmtBRL(parcela)+'</span></div>' : "");
  },
  pickSimJuros: function(btn, val){
    var parent = btn.parentElement;
    Array.prototype.forEach.call(parent.querySelectorAll(".chip"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("f_sim_juros").value = val;
    Forms.updateSimuladorPreview();
  },
  updateSimuladorPreview: function(){
    var box = document.getElementById("preview-sim");
    if(!box) return;
    var valor = parseFloat(document.getElementById("f_sim_valor").value) || 0;
    var jurosPct = parseFloat(document.getElementById("f_sim_juros").value) || 0;
    var meses = parseInt(document.getElementById("f_sim_meses").value,10) || 1;
    var lbl = document.getElementById("sim-meses-label");
    if(lbl) lbl.textContent = meses+" mês"+(meses===1?"":"es");
    if(valor<=0){ box.innerHTML = '<div class="empty">Informe um valor para simular.</div>'; return; }
    var jurosMes = valor * (jurosPct/100);
    var totalPeriodo = jurosMes * meses;
    var html = '<div class="card" style="margin-bottom:14px;">'
      + '<div class="kpi-line"><span>Juro mensal ('+jurosPct+'%)</span><span class="v num">'+fmtBRL(jurosMes)+'</span></div>'
      + '<div class="kpi-line"><span>Total de juros em '+meses+' mês'+(meses===1?"":"es")+'</span><span class="v num" style="color:var(--critical)">'+fmtBRL(totalPeriodo)+'</span></div>'
      + '<div class="kpi-line"><span>Valor emprestado (nunca abatido)</span><span class="v num">'+fmtBRL(valor)+'</span></div>'
      + '</div>';
    html += '<div class="tablewrap"><table><tr><th>Mês</th><th class="num">Juro do mês</th><th class="num">Total acumulado</th></tr>';
    var acumulado = 0;
    for(var i=1;i<=meses;i++){
      acumulado += jurosMes;
      html += '<tr><td>'+i+'</td><td class="num">'+fmtBRL(jurosMes)+'</td><td class="num" style="font-weight:800;color:var(--critical)">'+fmtBRL(acumulado)+'</td></tr>';
    }
    html += '</table></div>';
    box.innerHTML = html;
  }
};

function sheetDetalhe(tipo){
  var mk = currentMesAno();
  var titulo = "", sub = "", rows = "", total = 0;
  if(tipo==="saldo-atual"){
    titulo = "💰 Saldo atual"; sub = "Composição do saldo: tudo que já entrou menos tudo que já foi pago.";
    var hoje = todayISO();
    var entradasPagas = STATE.entradas.filter(function(e){return e.data<=hoje;});
    var saidasPagas = todasSaidasFlat().filter(function(s){return s.status==="pago";});
    total = saldoAtual();
    entradasPagas.forEach(function(e){ rows += entradaRow(e); });
    saidasPagas.forEach(function(s){ rows += saidaRow(s); });
    if(!entradasPagas.length && !saidasPagas.length) rows = '<div class="empty">Nada registrado ainda.</div>';
  } else if(tipo==="despesas-futuras"){
    titulo = "💳 Despesas futuras"; sub = "Contas de "+monthLabel(mk)+" que ainda não foram pagas.";
    var itens = todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && effStatus(s)!=="pago" && s.status!=="cancelado"; });
    total = itens.reduce(function(s,x){return s+x.valor;},0);
    itens.forEach(function(s){ rows += saidaRow(s); });
    if(!itens.length) rows = '<div class="empty">Nenhuma despesa futura este mês.</div>';
  } else if(tipo==="entradas-mes"){
    titulo = "📈 Entradas do mês"; sub = "Entradas registradas em "+monthLabel(mk)+".";
    var itensE = STATE.entradas.filter(function(e){ return monthKey(e.data)===mk; });
    total = somaEntradasMes(mk);
    itensE.forEach(function(e){ rows += entradaRow(e); });
    if(!itensE.length) rows = '<div class="empty">Nenhuma entrada este mês.</div>';
  } else if(tipo==="saidas-mes"){
    titulo = "📉 Saídas do mês"; sub = "Saídas com vencimento em "+monthLabel(mk)+".";
    var itensS = todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && s.status!=="cancelado"; });
    total = somaSaidasMes(mk);
    itensS.forEach(function(s){ rows += saidaRow(s); });
    if(!itensS.length) rows = '<div class="empty">Nenhuma saída este mês.</div>';
  } else if(tipo==="a-receber"){
    titulo = "🤝 Juros a receber (mês)"; sub = "Juros de "+monthLabel(mk)+" ainda não recebidos.";
    var itensAR = itensJurosAReceberMes(mk);
    total = jurosAReceberMes(mk);
    itensAR.forEach(function(v){ rows += emprestimoVencRow({emp:v.emp, vencimento:v.vencimento, valor:v.valor, label:v.label}); });
    if(!itensAR.length) rows = '<div class="empty">Nenhum juro pendente este mês.</div>';
  } else if(tipo==="ja-recebido"){
    titulo = "✅ Já recebido"; sub = "Total histórico já recebido de empréstimos (juros e principal).";
    total = totalRecebidoEmprestimos();
    STATE.emprestimos.forEach(function(e){
      if(e.tipoCobranca==="juros"){
        e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).forEach(function(o){ rows += emprestimoVencRow({emp:e, vencimento:o.dataPagamento||o.vencimento, valor:o.valor, label:"Juro de "+monthLabel(o.mesAno)}); });
        if(e.quitacao) rows += emprestimoVencRow({emp:e, vencimento:e.quitacao.data, valor:e.quitacao.valorPrincipal, label:"Principal quitado"});
      } else {
        e.parcelas.filter(function(p){return p.status==="pago";}).forEach(function(p){ rows += emprestimoVencRow({emp:e, vencimento:p.dataPagamento||p.vencimento, valor:p.valor, label:"Parcela "+p.numero+"/"+e.qtdParcelas}); });
      }
    });
    if(!rows) rows = '<div class="empty">Nada recebido ainda.</div>';
  } else if(tipo==="juros-recebido"){
    titulo = "📈 Juros recebidos (mês)"; sub = "Juros efetivamente recebidos em "+monthLabel(mk)+".";
    var itensJR = itensJurosRecebidoMes(mk);
    total = jurosRecebidoMes(mk);
    itensJR.forEach(function(v){ rows += emprestimoVencRow({emp:v.emp, vencimento:v.data, valor:v.valor, label:v.label}); });
    if(!itensJR.length) rows = '<div class="empty">Nenhum juro recebido este mês.</div>';
  } else if(tipo==="vence-7-dias"){
    titulo = "📅 Vencendo em 7 dias"; sub = "Parcelas e juros de empréstimo com vencimento nos próximos 7 dias.";
    var itensV = proximosVencimentosEmprestimo(7);
    total = itensV.reduce(function(s,v){return s+v.valor;},0);
    itensV.forEach(function(v){ rows += emprestimoVencRow(v); });
    if(!itensV.length) rows = '<div class="empty">Nada vencendo nos próximos 7 dias.</div>';
  } else {
    return "";
  }
  return '<h3>'+titulo+'</h3><div class="sheet-sub">'+sub+'</div>'
    + '<div class="card" style="margin-bottom:12px;"><div class="kpi-line"><span>Total</span><span class="v num">'+fmtBRL(total)+'</span></div></div>'
    + '<div class="list" style="margin-bottom:12px;">'+rows+'</div>'
    + '<div class="btn-row"><button class="btn btn-secondary" onclick="Modals.close()">Fechar</button></div>';
}

function sheetVerSaida(key){
  var parts = key.split("|");
  var kind=parts[0], parentId=parts[1], sub=parts[2];
  var item = todasSaidasFlat().find(function(x){ return x.kind===kind && x.parentId===parentId && String(x.numero||x.mesAno||"")===sub; });
  if(!item) return "";
  var c = catInfoSaida(item.categoria);
  var st = effStatus(item);
  var html = '<h3>'+c.emoji+' '+esc(item.nome)+'</h3><div class="sheet-sub">'+(item.parcelaLabel?item.parcelaLabel+' • ':'')+c.label+'</div>';
  html += '<div class="card" style="margin-bottom:14px;">'
    + '<div class="kpi-line"><span>Valor</span><span class="v num" style="color:var(--critical)">-'+fmtBRL(item.valor)+'</span></div>'

/* ============================== ACTIONS ============================== */
window.Actions = {
  setTipoSaida: function(btn, tipo){
    var seg = document.getElementById("tipo-saida-seg");
    Array.prototype.forEach.call(seg.querySelectorAll("button"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("f_tipo").value = tipo;
    document.getElementById("campos-unica").style.display = tipo==="unica"?"block":"none";
    document.getElementById("campos-parcelada").style.display = tipo==="parcelada"?"block":"none";
    document.getElementById("campos-recorrente").style.display = tipo==="recorrente"?"block":"none";
    document.getElementById("lbl_nome").textContent = tipo==="unica" ? "Descrição" : "Nome da despesa";
  },
  salvarEntrada: function(){
    var cat = document.getElementById("f_cat").value || "outros";
    var desc = document.getElementById("f_desc").value.trim();
    var valor = parseFloat(document.getElementById("f_valor").value);
    var data = document.getElementById("f_data").value || todayISO();
    var obs = document.getElementById("f_obs").value.trim();
    var rec = document.getElementById("f_recorrente").checked;
    if(!valor || valor<=0){ showToast("Informe um valor válido."); return; }
    if(rec){
      salvarRendaFixa({descricao:desc||"Salário", valor:valor, dia:dayOf(data)}, "todas");
    } else {
      addEntrada({categoria:cat, descricao:desc, valor:valor, data:data, observacao:obs});
    }
    Modals.close(); scheduleSave(); showToast("Entrada salva ✓");
  },
  excluirEntrada: function(id){
    var e = STATE.entradas.find(function(x){return x.id===id;});

  exportarDados: function(){
    var json = JSON.stringify(STATE, null, 2);
    var d = new Date();
    var pad = function(n){ return n<10 ? "0"+n : ""+n; };
    var fname = "financas-alif-backup-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(dl){
        if(!dl){ fallbackDownload(json, fname); return; }
        dl.save({ filename: fname, data: json }).then(function(){
          showToast("Backup salvo!");
        }).catch(function(err){
          if(err && err.code==="declined") return;
          fallbackDownload(json, fname);
        });
      }).catch(function(){ fallbackDownload(json, fname); });
    } else {
      fallbackDownload(json, fname);
    }
  },
  processarImportacao: function(input){
    var file = input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{ parsed = JSON.parse(e.target.result); }catch(err){ showToast("Arquivo inválido"); return; }
      if(!parsed || !parsed.perfil){ showToast("Arquivo não reconhecido como backup do app"); return; }
      UI.confirm = { tipo:"importarDados", args:[parsed], mensagem:"Importar este backup vai SUBSTITUIR todos os dados atuais neste dispositivo. Continuar?", label:"Importar" };
      render();
    };
    reader.onerror = function(){ showToast("Não foi possível ler o arquivo"); };
    reader.readAsText(file);
    input.value = "";
  }
};
function fallbackDownload(text, filename){
  try{
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Backup baixado!");
  }catch(e){
    showToast("Não foi possível gerar o arquivo de backup");
  }
}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.pill.good{background:rgba(30,143,90,.14);color:var(--accent-strong);}
.pill.info{background:rgba(49,105,176,.14);color:var(--info);}
.pill.warn{background:rgba(193,134,27,.16);color:var(--warn);}
.pill.crit{background:rgba(162,59,46,.14);color:var(--critical);}
.pill.neutral{background:var(--surface-alt);color:var(--ink-muted);}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
.colgroup{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;}
.bar{width:9px;border-radius:3px 3px 0 0;}
.bar.in{background:var(--info);}
.bar.out{background:var(--warn);}
.xl{font-size:10.5px;color:var(--ink-muted);}
.legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--ink-muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.barlist{display:flex;flex-direction:column;gap:10px;}
.bl-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.bl-track{height:6px;border-radius:3px;background:var(--surface-alt);overflow:hidden;}
.bl-fill{height:100%;background:var(--accent-strong);border-radius:3px;}
.muted{color:var(--ink-muted);}
.small{font-size:12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14.5px;color:var(--ink);}
.field textarea{min-height:64px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.segmented{display:flex;background:var(--surface-alt);border-radius:10px;padding:3px;gap:3px;}
.segmented button{flex:1;border:none;background:none;padding:9px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-muted);cursor:pointer;}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.hint{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 16px 20px;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:2px auto 14px;}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800;}
.sheet-sub{font-size:13px;color:var(--ink-muted);margin-bottom:16px;}
.form-scroll{max-height:56vh;overflow-y:auto;padding-right:2px;margin-bottom:14px;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:10px 4px;font-size:10.5px;font-weight:700;color:var(--ink-muted);cursor:pointer;}
.catbtn .e{font-size:18px;}
.catbtn.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.radio-cards{display:flex;flex-direction:column;gap:10px;}
.radio-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;}
.radio-card .t{font-weight:800;font-size:14px;margin-bottom:3px;}
.radio-card .d{font-size:12px;color:var(--ink-muted);}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;}
.save-banner{position:fixed;right:14px;bottom:96px;font-size:10.5px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--border);padding:4px 9px;border-radius:999px;z-index:40;}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg) 60%, transparent);z-index:45;}
.tabbar-inner{width:100%;max-width:480px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 10px;box-shadow:0 8px 24px rgba(20,20,19,.10);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-muted);font-size:10.5px;font-weight:700;padding:4px 2px;cursor:pointer;border-radius:10px;}
.tab .ic{font-size:18px;}
.tab.active{color:var(--accent-strong);}
.fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(20,20,19,.25);cursor:pointer;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
</style>`;

/* ============================== INIT ============================== */
function loadInitialState(){
  var el = document.getElementById("state-data");
  var raw = null;
  try{ raw = JSON.parse(el.textContent); }catch(e){ raw = null; }
  if(!raw || !raw.perfil){
    try{ var ls = localStorage.getItem("financas-alif-state"); if(ls) raw = JSON.parse(ls); }catch(e2){}
  }
  STATE = raw && raw.perfil ? raw : defaultState();
  if(!STATE.eventosHistorico) STATE.eventosHistorico = [];
  if(!STATE.compromissos) STATE.compromissos = [];
  if(!STATE.categoriasEntradaExtras) STATE.categoriasEntradaExtras = [];
  if(!STATE.categoriasSaidaExtras) STATE.categoriasSaidaExtras = [];
  if(!STATE.perfil.tema) STATE.perfil.tema = "sistema";
  if(STATE.perfil.ocultarValores===undefined) STATE.perfil.ocultarValores = false;
}

function aplicarTema(){
  var root = document.documentElement;
  var tema = STATE.perfil.tema;
  if(tema==="claro") root.setAttribute("data-theme","light");
  else if(tema==="escuro") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme");
}

function init(){
  document.head.insertAdjacentHTML("beforeend", APP_CSS);
  HEAD_HTML = document.head.outerHTML;
  OWN_SCRIPT_OUTER = document.currentScript.outerHTML;
  loadInitialState();
  ensureAllGenerated();
  aplicarTema();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      claudeArtifact = ns;
      saveMode = ns ? "cloud" : "local";
      renderSaveBadge();
    }).catch(function(){ saveMode = "local"; renderSaveBadge(); });
  } else {
    saveMode = "local";
  }

  render();
}

init();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); });
}
</script>
