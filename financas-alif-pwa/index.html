<!doctype html>
<html lang="pt-BR">
<head>
<title>Financas do ALIF</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --bg:#f2f3f8;
  --bg-glow1:rgba(109,77,255,.10);
  --bg-glow2:rgba(6,182,212,.08);
  --ink:#0b0d17;
  --ink-muted:#636a7e;
  --surface:#ffffff;
  --surface-alt:#eef0f6;
  --surface-glass:rgba(255,255,255,.80);
  --border:#e2e5ee;
  --accent-strong:#07a56f;
  --info:#5b45f0;
  --warn:#d98a00;
  --critical:#e0314f;
  --violet:#6d4dff;
  --cyan:#06b6d4;
  --grad:linear-gradient(135deg,#6d4dff 0%,#06b6d4 100%);
  --shadow:0 1px 2px rgba(16,20,40,.04),0 10px 28px rgba(16,20,40,.07);
  --ring:0 0 0 3px rgba(109,77,255,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#05060b; --bg-glow1:rgba(124,92,255,.20); --bg-glow2:rgba(34,211,238,.10);
    --ink:#eef1f8; --ink-muted:#8a91a7; --surface:#0f111a; --surface-alt:#171a27; --surface-glass:rgba(15,17,26,.74);
    --border:rgba(255,255,255,.08); --accent-strong:#2ee6a6; --info:#8b7bff; --warn:#ffb547; --critical:#ff5577;
    --violet:#8b6bff; --cyan:#22d3ee;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.45);
    --ring:0 0 0 3px rgba(139,107,255,.30);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#05060b; --bg-glow1:rgba(124,92,255,.20); --bg-glow2:rgba(34,211,238,.10);
  --ink:#eef1f8; --ink-muted:#8a91a7; --surface:#0f111a; --surface-alt:#171a27; --surface-glass:rgba(15,17,26,.74);
  --border:rgba(255,255,255,.08); --accent-strong:#2ee6a6; --info:#8b7bff; --warn:#ffb547; --critical:#ff5577;
  --violet:#8b6bff; --cyan:#22d3ee;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.45);
  --ring:0 0 0 3px rgba(139,107,255,.30);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font:14px/1.4 var(--font);color:var(--ink);
  background:radial-gradient(700px 420px at 100% -8%,var(--bg-glow1),transparent 62%),radial-gradient(560px 420px at -12% 38%,var(--bg-glow2),transparent 62%),var(--bg);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
button,input,select,textarea{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;}
.shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:env(safe-area-inset-top,0px) 0 112px;}
.topbar{padding:18px 16px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.greet-sm{font-size:12.5px;font-weight:600;color:var(--ink-muted);letter-spacing:.02em;}
h1{font-family:var(--font-display);font-size:23px;margin:0;font-weight:700;letter-spacing:-.02em;}
.sub{margin:4px 0 0;color:var(--ink-muted);font-size:13px;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--border);background:var(--surface-glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.icon-btn:active{transform:scale(.94);}
.me-avatar{width:40px;height:40px;border-radius:14px;border:none;background:var(--grad);color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(109,77,255,.35);}
main{padding:4px 16px 12px;}
main.enter > *{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) both;}
main.enter > *:nth-child(2){animation-delay:.03s;} main.enter > *:nth-child(3){animation-delay:.06s;} main.enter > *:nth-child(4){animation-delay:.09s;} main.enter > *:nth-child(5){animation-delay:.12s;} main.enter > *:nth-child(n+6){animation-delay:.15s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.section{margin-top:16px;}
.section:first-child{margin-top:0;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
h2{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;}
.link{background:none;border:none;color:var(--info);font-size:13px;font-weight:700;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;}
.stat .label{font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.stat .label .ico{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--info);flex:none;}
.stat .label .ico svg.i{width:15px;height:15px;}
.stat.pos .label .ico{color:var(--accent-strong);}
.stat.neg .label .ico{color:var(--critical);}
.stat .value{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat.pos .value{color:var(--accent-strong);}
.stat.neg .value{color:var(--critical);}
.stat-sub{font-size:11px;font-weight:500;color:var(--ink-muted);margin-top:4px;}
.stat[onclick]:active,.row:active,.tile:active,.qa:active{transform:scale(.98);}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:26px 0 18px;}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;
  background:radial-gradient(120% 130% at 100% 0%,rgba(34,211,238,.38),transparent 52%),radial-gradient(110% 120% at 0% 100%,rgba(124,92,255,.62),transparent 58%),#0c0e19;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(40,30,120,.30);}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(90% 80% at 80% 10%,#000,transparent 70%);mask-image:radial-gradient(90% 80% at 80% 10%,#000,transparent 70%);pointer-events:none;}
.hero > *{position:relative;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.hero-label{font-size:12px;font-weight:600;opacity:.72;letter-spacing:.04em;}
.hero-amt{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.1;}
.hero-note{font-size:12px;opacity:.7;margin-top:4px;}
.hero-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.hero-mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 12px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.hero-mini .t{font-size:11px;opacity:.72;display:flex;align-items:center;gap:6px;font-weight:600;}
.hero-mini .t .dot{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.hero-mini .t .dot svg.i{width:12px;height:12px;stroke-width:2.6;}
.hero-mini .v{font-family:var(--font-display);font-size:16px;font-weight:700;margin-top:6px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero .pill{background:rgba(255,255,255,.14);color:#fff;}
.ring-wrap{position:relative;width:74px;height:74px;flex:none;}
.ring-wrap .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1;}
.ring-wrap .ring-txt small{font-family:var(--font);font-size:9px;font-weight:600;opacity:.7;margin-top:3px;letter-spacing:.04em;}

/* QUICK ACTIONS */
.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;color:var(--ink);font-size:11.5px;font-weight:600;padding:0;}
.qa .qa-ic{width:54px;height:54px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--info);}
.qa .qa-ic svg.i{width:22px;height:22px;}
.qa.in .qa-ic{color:var(--accent-strong);}
.qa.out .qa-ic{color:var(--critical);}
.qa.cy .qa-ic{color:var(--cyan);}

/* TILES */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--ink);min-width:0;}
.tile .t-ic{width:32px;height:32px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;}
.tile .t-ic svg.i{width:16px;height:16px;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-muted);padding:2px 0 6px;letter-spacing:.04em;}
.cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;cursor:pointer;background:var(--surface-alt);border:1px solid transparent;transition:background .15s;}
.cal-day.has{background:color-mix(in srgb,var(--violet) 12%,var(--surface-alt));border-color:color-mix(in srgb,var(--violet) 28%,transparent);}
.cal-day.has-late{background:color-mix(in srgb,var(--critical) 12%,var(--surface-alt));border-color:color-mix(in srgb,var(--critical) 30%,transparent);}
.cal-day.has-paid{background:color-mix(in srgb,var(--accent-strong) 10%,var(--surface-alt));}
.cal-day.empty{cursor:default;background:none;border:none;padding:0;}
.cal-num{font-size:12px;font-weight:600;color:var(--ink);}
.cal-amt{font-size:8.5px;font-weight:700;color:var(--ink-muted);line-height:1;white-space:nowrap;}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--violet);}
.cal-day.today .cal-num{color:var(--violet);font-weight:800;}
.cal-dots{display:flex;gap:2px;height:5px;}
.cal-dots i{width:5px;height:5px;border-radius:50%;display:inline-block;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.cal-nav .ttl{font-family:var(--font-display);font-weight:700;font-size:15.5px;}
.cal-nav .icon-btn{width:34px;height:34px;border-radius:11px;}

.insight{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:11px 13px;font-size:13px;margin-bottom:8px;box-shadow:var(--shadow);}
.insight .in-ic{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--violet);}
.insight .in-ic svg.i{width:15px;height:15px;}
.insight b{color:var(--ink);font-family:var(--font-display);}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(109,77,255,.30);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:var(--shadow);}
.card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;}
.card-title .cap{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.kpi-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kpi-line:last-child{border-bottom:none;}
.kpi-line .v{font-weight:700;text-align:right;}
.num{font-variant-numeric:tabular-nums;}
.empty{color:var(--ink-muted);font-size:13px;padding:18px 14px;text-align:center;background:var(--surface-alt);border-radius:16px;border:1px dashed var(--border);}
.list{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;}
.emoji{width:40px;height:40px;border-radius:13px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;font-weight:700;font-family:var(--font-display);color:var(--ink);}
.skull-av{background:#000 !important;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.45);}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);font-size:15px;flex:none;}
.info{flex:1;min-width:0;}
.title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.amt{font-family:var(--font-display);font-weight:700;font-size:14px;flex:none;letter-spacing:-.01em;}
.amt.in{color:var(--accent-strong);}
.amt.out{color:var(--critical);}
.backbtn{background:none;border:none;color:var(--info);font-weight:700;font-size:13px;padding:0 0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.btn-row{display:flex;gap:10px;}
.btn{flex:1;border:none;border-radius:16px;padding:14px 14px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(109,77,255,.32);}
.btn-success{background:linear-gradient(135deg,#10b981,#2ee6a6);color:#04120c;box-shadow:0 10px 24px rgba(16,185,129,.28);}
.btn-secondary{background:var(--surface-alt);color:var(--ink);border:1px solid var(--border);}
.btn-danger{background:color-mix(in srgb,var(--critical) 12%,transparent);color:var(--critical);}
.btn-ghost{background:none;color:var(--ink-muted);}
.btn-sm{padding:8px 12px;font-size:12.5px;flex:none;border-radius:12px;box-shadow:none;}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--ink-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.good{background:color-mix(in srgb,var(--accent-strong) 14%,transparent);color:var(--accent-strong);}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info);}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
.pill.crit{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical);}
.pill.neutral{background:var(--surface-alt);color:var(--ink-muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-svg text{font-family:var(--font);font-size:10px;fill:var(--ink-muted);}
.chart-readout{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted);min-height:18px;margin-bottom:6px;}
.chart-readout b{font-family:var(--font-display);color:var(--ink);font-size:13px;}
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut-box{position:relative;width:140px;height:140px;flex:none;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.donut-center .dv{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.02em;}
.donut-center .dl{font-size:10.5px;color:var(--ink-muted);font-weight:600;}
.donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.donut-legend .dl-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.donut-legend .dl-row i{width:10px;height:10px;border-radius:4px;flex:none;}
.donut-legend .dl-row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.donut-legend .dl-row .p{font-weight:700;color:var(--ink-muted);font-size:11.5px;}
.barlist{display:flex;flex-direction:column;gap:12px;}
.bl-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.bl-track{height:8px;border-radius:99px;background:var(--surface-alt);overflow:hidden;}
.bl-fill{height:100%;background:var(--grad);border-radius:99px;}
.muted{color:var(--ink-muted);}
.small{font-size:12px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:6px;letter-spacing:.02em;}
.field input,.field select,.field textarea,input.inp{width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:14px;padding:12px 13px;font-size:15px;color:var(--ink);outline:none;transition:box-shadow .15s,border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus,input.inp:focus{border-color:var(--violet);box-shadow:var(--ring);}
.field input[type=checkbox]{width:auto;accent-color:var(--violet);}
.field input[type=range]{padding:0;background:none;border:none;accent-color:var(--violet);box-shadow:none;}
.field textarea{min-height:64px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
.segmented{display:flex;background:var(--surface-alt);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--border);}
.segmented button{flex:1;border:none;background:none;padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.10);}
.hint{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
.overlay{position:fixed;inset:0;background:rgba(5,6,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadeIn .2s ease both;}
.overlay.noanim,.overlay.noanim .sheet{animation:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--border);border-bottom:none;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both;}
.sheet-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:4px auto 16px;}
.sheet h3{margin:0 0 4px;font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;}
.sheet-sub{font-size:13px;color:var(--ink-muted);margin-bottom:16px;}
.form-scroll{max-height:58vh;overflow-y:auto;padding-right:2px;margin-bottom:14px;}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface-alt);border:1px solid var(--border);border-radius:14px;padding:10px 4px;font-size:10.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
.catbtn .e{font-size:19px;}
.catbtn.sel{background:color-mix(in srgb,var(--violet) 14%,var(--surface-alt));border-color:var(--violet);color:var(--ink);box-shadow:var(--ring);}
.radio-cards{display:flex;flex-direction:column;gap:10px;}
.radio-card{display:flex;align-items:center;gap:12px;background:var(--surface-alt);border:1px solid var(--border);border-radius:18px;padding:14px;cursor:pointer;}
.radio-card .rc-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--violet);flex:none;}
.radio-card .t{font-weight:700;font-size:14px;margin-bottom:2px;}
.radio-card .d{font-size:12px;color:var(--ink-muted);}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s ease both;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:45;pointer-events:none;}
.tabbar-inner{pointer-events:auto;position:relative;width:100%;max-width:452px;display:flex;align-items:center;gap:2px;background:var(--surface-glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--border);border-radius:26px;padding:8px 8px;box-shadow:0 14px 34px rgba(0,0,0,.18);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-muted);font-size:10.5px;font-weight:600;padding:5px 2px;cursor:pointer;border-radius:14px;position:relative;}
.tab svg.i{width:21px;height:21px;}
.tab.active{color:var(--violet);}
.tab.active::after{content:"";position:absolute;bottom:-3px;width:16px;height:3px;border-radius:3px;background:var(--grad);}
.fab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:58px;height:58px;border-radius:20px;border:4px solid var(--bg);background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(109,77,255,.45);cursor:pointer;padding:0;}

.loan-hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;

var CHART_PALETTE = ["#7c5cff","#22d3ee","#2ee6a6","#ffb547","#ff5577","#f472b6","#60a5fa","#a3e635","#fb923c","#94a3b8"];
var CHART_DATA = {};
function fmtCompact(n){
  if(STATE && STATE.perfil && STATE.perfil.ocultarValores) return "••";
  n = Number(n)||0; var a = Math.abs(n);
  if(a>=1000000) return (n/1000000).toFixed(1).replace(".",",")+"mi";
  if(a>=1000) return (n/1000).toFixed(a>=10000?0:1).replace(".",",")+"k";
  return String(Math.round(n));
}
function smoothPath(pts){
  if(pts.length<2) return "";
  var d = "M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    var c1x = p1[0]+(p2[0]-p0[0])/6, c1y = p1[1]+(p2[1]-p0[1])/6;
    var c2x = p2[0]-(p3[0]-p1[0])/6, c2y = p2[1]-(p3[1]-p1[1])/6;
    d += " C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
  }
  return d;
}
/* Gráfico de área suave com 2 séries. series: [{nome, cor, valores[]}], labels: [] */
function areaChart(id, series, labels){
  var W=320, H=150, padL=6, padR=6, padT=12, padB=22;
  var n = labels.length;
  var max = 1;
  series.forEach(function(s){ s.valores.forEach(function(v){ if(v>max) max=v; }); });
  max = max*1.12;
  var step = n>1 ? (W-padL-padR)/(n-1) : 0;
  function xy(i,v){ return [padL+i*step, padT+(H-padT-padB)*(1-v/max)]; }
  CHART_DATA[id] = { series:series, labels:labels };
  var svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">';
  svg += '<defs>';
  series.forEach(function(s,si){
    svg += '<linearGradient id="'+id+'_g'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.cor+'" stop-opacity=".38"/><stop offset="100%" stop-color="'+s.cor+'" stop-opacity="0"/></linearGradient>';
  });
  svg += '</defs>';
  for(var g=0; g<4; g++){ var gy = padT+(H-padT-padB)*g/3; svg += '<line x1="0" x2="'+W+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="currentColor" stroke-opacity=".08" stroke-dasharray="3 4"/>'; }
  series.forEach(function(s,si){
    var pts = s.valores.map(function(v,i){ return xy(i,v); });
    var line = smoothPath(pts);
    var base = H-padB;
    svg += '<path d="'+line+' L'+pts[pts.length-1][0].toFixed(1)+','+base+' L'+pts[0][0].toFixed(1)+','+base+' Z" fill="url(#'+id+'_g'+si+')"/>';
    svg += '<path d="'+line+'" fill="none" stroke="'+s.cor+'" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  });
  svg += '<line id="'+id+'_cursor" x1="0" x2="0" y1="'+padT+'" y2="'+(H-padB)+'" stroke="currentColor" stroke-opacity=".25" stroke-width="1" style="display:none" vector-effect="non-scaling-stroke"/>';
  labels.forEach(function(l,i){
    var x = padL+i*step;
    svg += '<text x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+(i===0?"start":(i===n-1?"end":"middle"))+'">'+esc(l)+'</text>';
    var w = step || W;
    svg += '<rect x="'+Math.max(0,x-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="transparent" style="cursor:pointer" onclick="Charts.pick(\''+id+'\','+i+')"/>';
  });
  svg += '</svg>';
  var last = n-1;
  return '<div class="chart-readout" id="'+id+'_ro">'+chartReadout(id,last)+'</div><div style="color:var(--ink)">'+svg+'</div>'
    + '<div class="legend">'+series.map(function(s){ return '<span><i style="background:'+s.cor+'"></i>'+esc(s.nome)+'</span>'; }).join("")+'</div>';

function chartReadout(id, i){
  var d = CHART_DATA[id]; if(!d) return "";

}

  var R=54, C=2*Math.PI*R, off=0, gap = itens.length>1 ? 3 : 0;
  var svg = '<svg viewBox="0 0 140 140" width="140" height="140" style="transform:rotate(-90deg)">';
  svg += '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--surface-alt)" stroke-width="16"/>';
  if(total>0){
    itens.forEach(function(x){
      var len = C*(x.valor/total);
      var vis = Math.max(0.5, len-gap);
      svg += '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+x.cor+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+vis.toFixed(2)+' '+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
      off += len;
    });
  }
  svg += '</svg>';
  var legend = itens.map(function(x){
    var pct = total ? Math.round(x.valor/total*100) : 0;
    return '<div class="dl-row"><i style="background:'+x.cor+'"></i><span class="n">'+esc(x.label)+'</span><span class="p">'+pct+'%</span></div>';
  }).join("");
  return '<div class="donut-wrap"><div class="donut-box">'+svg+'<div class="donut-center"><div class="dv num">'+centroValor+'</div><div class="dl">'+esc(centroLabel)+'</div></div></div><div class="donut-legend">'+legend+'</div></div>';
}

function ringChart(pct, cor, label){

    + '</svg><div class="ring-txt">'+Math.round(pct)+'%<small>'+esc(label)+'</small></div></div>';

/* Barras arredondadas com valores positivos/negativos (saldo mês a mês) */
function saldoBarChart(valores, labels){
  var W=320, H=150, padB=20, padT=10;
  var maxAbs = 1; valores.forEach(function(v){ if(Math.abs(v)>maxAbs) maxAbs=Math.abs(v); });
  var hasNeg = valores.some(function(v){return v<0;});
  var zeroY = hasNeg ? padT+(H-padT-padB)/2 : H-padB;
  var span = hasNeg ? (H-padT-padB)/2 : (H-padT-padB);
  var n = valores.length, slot = W/n, bw = Math.min(26, slot*0.52);
  var svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'"><defs>'
    + '<linearGradient id="sbPos" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2ee6a6"/><stop offset="100%" stop-color="#22d3ee" stop-opacity=".55"/></linearGradient>'
    + '<linearGradient id="sbNeg" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ff5577"/><stop offset="100%" stop-color="#f472b6" stop-opacity=".55"/></linearGradient></defs>';
  svg += '<line x1="0" x2="'+W+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="currentColor" stroke-opacity=".15"/>';
  valores.forEach(function(v,i){
    var h = Math.max(3, Math.abs(v)/maxAbs*span);
    var x = i*slot+(slot-bw)/2;
    var y = v>=0 ? zeroY-h : zeroY;
    svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="7" fill="url(#'+(v>=0?"sbPos":"sbNeg")+')"><title>'+esc(labels[i])+': '+fmtBRL(v)+'</title></rect>';
    svg += '<text x="'+(i*slot+slot/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  svg += '</svg>';
  return '<div style="color:var(--ink)">'+svg+'</div>';
}

function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ s=(s===undefined||s===null)?"":String(s); return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function attr(s){ return esc(s).replace(/`/g,"&#96;"); }
function fmtBRL(n){ if(STATE && STATE.perfil && STATE.perfil.ocultarValores) return "R$ ••••"; n = Number(n)||0; return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return n<10?"0"+n:""+n; }
function monthKeyFromParts(y,mIdx){ return y+"-"+pad(mIdx+1); }
function monthKey(dateISO){ return dateISO ? dateISO.slice(0,7) : null; }
function monthLabel(mk){ if(!mk) return ""; var p=mk.split("-"); return MESES[parseInt(p[1],10)-1]+"/"+p[0]; }
function monthLabelShort(mk){ var p=mk.split("-"); return MESES_ABR[parseInt(p[1],10)-1]+"/"+p[0].slice(2); }
function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function addMonthsToKey(mk,n){ var p=mk.split("-").map(Number); var d=new Date(p[0],p[1]-1+n,1); return monthKeyFromParts(d.getFullYear(),d.getMonth()); }
function monthDiff(a,b){ var pa=a.split("-").map(Number), pb=b.split("-").map(Number); return (pb[0]-pa[0])*12+(pb[1]-pa[1]); }
function cmpKey(a,b){ return a<b?-1:(a>b?1:0); }
function dateFromMesAnoDia(mesAno, dia){
  var p=mesAno.split("-").map(Number);
  var lastDay = new Date(p[0], p[1], 0).getDate();
  var d = Math.min(dia||1, lastDay);
  return mesAno+"-"+pad(d);
}
function dayOf(iso){ return iso ? parseInt(iso.split("-")[2],10) : 1; }
function currentMesAno(){ return monthKey(todayISO()); }

/* ============================== GERAÇÃO / HORIZONTE ============================== */
function horizonAlvo(){ return addMonthsToKey(currentMesAno(), 15); }

function valorEfetivo(base, alteracoes, mesAno){
  var v = base;
  var melhor = null;
  (alteracoes||[]).forEach(function(a){
    if(cmpKey(a.apartirMesAno, mesAno) <= 0){
      if(!melhor || cmpKey(a.apartirMesAno, melhor.apartirMesAno) > 0) melhor = a;
    }
  });
  return melhor ? melhor.valor : v;
}

function ensureRendaFixa(){
  var rf = STATE.rendaFixa;
  if(!rf || !rf.ativa) return;
  if(!rf.excluidas) rf.excluidas = [];
  var alvo = horizonAlvo();
  var cursor = rf.inicioMesAno;
  var existentes = {};
  STATE.entradas.forEach(function(e){ if(e.origem==="fixa" && e.rendaFixaId===rf.id) existentes[e.mesAno]=e; });
  while(cmpKey(cursor, alvo) <= 0){
    if(rf.fimMesAno && cmpKey(cursor, rf.fimMesAno) > 0) break;
    if(!existentes[cursor] && rf.excluidas.indexOf(cursor)===-1){
      var valor = valorEfetivo(rf.valorBase, rf.alteracoes, cursor);
      STATE.entradas.push({
        id: uid("ent"), tipo:"salario", categoria:"salario", origem:"fixa", rendaFixaId: rf.id,
        mesAno: cursor, valor: valor, descricao: rf.descricao || "Salário",
        data: dateFromMesAnoDia(cursor, rf.diaRecebimento), observacao:""
      });
    }
    cursor = addMonthsToKey(cursor,1);
  }
}

function ensureSaidaRecorrente(rec){
  if(!rec.ativa) return;
  if(!rec.excluidas) rec.excluidas = [];
  var alvo = horizonAlvo();
  var cursor = rec.inicioMesAno;
  var existentes = {};
  (rec.ocorrencias||[]).forEach(function(o){ existentes[o.mesAno]=o; });
  while(cmpKey(cursor, alvo) <= 0){
    if(rec.encerradaApartirMesAno && cmpKey(cursor, rec.encerradaApartirMesAno) >= 0) break;
    if(!existentes[cursor] && rec.excluidas.indexOf(cursor)===-1){
      var valor = valorEfetivo(rec.valorBase, rec.alteracoes, cursor);
      rec.ocorrencias.push({
        mesAno: cursor, valor: valor, vencimento: dateFromMesAnoDia(cursor, rec.diaVencimento),
        status:"pendente", dataPagamento:null
      });
    }
    cursor = addMonthsToKey(cursor,1);
  }
  rec.ocorrencias.sort(function(a,b){ return cmpKey(a.mesAno,b.mesAno); });
}

function ensureJurosEmprestimo(emp){
  if(!emp.ativa) return;
  if(emp.jurosPausado) return;
  var alvo = horizonAlvo();
  var cursor = emp.inicioMesAno;
  var existentes = {};
  (emp.jurosOcorrencias||[]).forEach(function(o){ existentes[o.mesAno]=o; });
  var excluidas = emp.jurosExcluidas||[];
  var limite = emp.qtdParcelasJuros || null;
  var contados = Object.keys(existentes).length + excluidas.filter(function(mk){ return !existentes[mk]; }).length;
  while(cmpKey(cursor, alvo) <= 0){
    if(limite && contados >= limite) break;
    if(!existentes[cursor] && excluidas.indexOf(cursor)===-1){
      emp.jurosOcorrencias.push({
        mesAno: cursor, valor: emp.jurosMensal, vencimento: dateFromMesAnoDia(cursor, emp.diaVencimento),
        status:"pendente", dataPagamento:null
      });
      contados++;
    }
    cursor = addMonthsToKey(cursor,1);
  }
  emp.jurosOcorrencias.sort(function(a,b){ return cmpKey(a.mesAno,b.mesAno); });
}

function ensureAllGenerated(){
  ensureRendaFixa();
  STATE.saidasRecorrentes.forEach(ensureSaidaRecorrente);
  STATE.emprestimos.filter(function(e){return e.tipoCobranca==="juros";}).forEach(ensureJurosEmprestimo);

}

function effStatus(item){

function empEventosDoMes(mk){

    } else {
      e.parcelas.forEach(function(p){
        if(monthKey(p.vencimento)!==mk || p.status==="cancelado") return;
        (dias[p.vencimento]=dias[p.vencimento]||[]).push({emp:e, tipo:"parcela", ref:p.numero, valor:p.valor, pago:p.status==="pago", vencimento:p.vencimento});
      });
    }
  });
  return dias;
}
/* Quanto a pessoa pagaria para quitar tudo naquele vencimento */
function valorQuitarTudo(e, refJuros){
  if(e.tipoCobranca==="juros"){
    var o = e.jurosOcorrencias.find(function(x){return x.mesAno===refJuros;});
    var jurosDoMes = (o && o.status!=="pago") ? o.valor : 0;
    return (e.status==="quitado" ? 0 : e.valorOriginal) + jurosDoMes;
  }
  return e.parcelas.filter(function(p){return p.status!=="pago" && p.status!=="cancelado";}).reduce(function(s,p){return s+p.valor;},0);
}

function saldoAtual(){
  var hoje = todayISO();
  var recebido = STATE.entradas.filter(function(e){return e.data<=hoje;}).reduce(function(s,e){return s+e.valor;},0);
  var pago = todasSaidasFlat().filter(function(s){return s.status==="pago";}).reduce(function(s,x){return s+x.valor;},0);
  return recebido - pago;
}
function saldoLiquidoEmprestimos(){
  var hoje = todayISO();
  var emprestado = STATE.emprestimos.filter(function(e){return e.dataEmprestimo<=hoje;}).reduce(function(s,e){return s+e.valorOriginal;},0);
  return totalRecebidoEmprestimos() + totalVendido() - emprestado;
}
function saldoPrevistoFimMes(){
  var mk = currentMesAno();
  var hoje = todayISO();
  var atual = saldoAtual();
  var entradasFuturas = STATE.entradas.filter(function(e){ return monthKey(e.data)===mk && e.data>hoje; }).reduce(function(s,e){return s+e.valor;},0);
  var saidasFuturas = todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && s.vencimento>hoje && s.status!=="pago" && s.status!=="cancelado"; }).reduce(function(s,x){return s+x.valor;},0);
  return atual + entradasFuturas - saidasFuturas;
}
function proximosVencimentos(dias){
  dias = dias||7;
  var hoje = todayISO();
  var lim = new Date(); lim.setDate(lim.getDate()+dias);
  var limISO = lim.getFullYear()+"-"+pad(lim.getMonth()+1)+"-"+pad(lim.getDate());
  return todasSaidasFlat().filter(function(s){ return s.status!=="pago" && s.status!=="cancelado" && s.vencimento>=hoje && s.vencimento<=limISO; })
    .sort(function(a,b){ return cmpKey(a.vencimento,b.vencimento); });
}
function proximosVencimentosEmprestimo(dias){
  dias = dias||7;
  var hoje = todayISO();
  var lim = new Date(); lim.setDate(lim.getDate()+dias);
  var limISO = lim.getFullYear()+"-"+pad(lim.getMonth()+1)+"-"+pad(lim.getDate());
  var out = [];
  STATE.emprestimos.forEach(function(e){
    if(e.status==="vendido" || e.status==="quitado") return;
    if(e.tipoCobranca==="juros"){
      e.jurosOcorrencias.forEach(function(o){
        if(o.status!=="pago" && o.vencimento>=hoje && o.vencimento<=limISO){ out.push({emp:e, vencimento:o.vencimento, valor:o.valor, label:"juro do mês"}); }
      });
    } else {
      e.parcelas.forEach(function(p){
        if(p.status!=="pago" && p.vencimento>=hoje && p.vencimento<=limISO){ out.push({emp:e, vencimento:p.vencimento, valor:p.valor, label:"parcela "+p.numero+"/"+e.qtdParcelas}); }
      });
    }
  });
  return out.sort(function(a,b){ return cmpKey(a.vencimento,b.vencimento); });
}

function salvarRendaFixa(data, modo){
  var mkAtual = currentMesAno();
  if(!STATE.rendaFixa){
    STATE.rendaFixa = { id: uid("rf"), descricao: data.descricao||"Salário", valorBase: data.valor,
      diaRecebimento: data.dia, inicioMesAno: mkAtual, fimMesAno: null, alteracoes: [], ativa: true };
    ensureRendaFixa();
    return;
  }
  var rf = STATE.rendaFixa;
  if(modo === "somente-este-mes"){
    var ent = STATE.entradas.find(function(e){ return e.origem==="fixa" && e.rendaFixaId===rf.id && e.mesAno===mkAtual; });
    if(ent) ent.valor = data.valor;
  } else {
    rf.alteracoes.push({ apartirMesAno: mkAtual, valor: data.valor });
    STATE.entradas = STATE.entradas.filter(function(e){ return !(e.origem==="fixa" && e.rendaFixaId===rf.id && cmpKey(e.mesAno, mkAtual) >= 0); });
    ensureRendaFixa();
  }
}

function marcarStatusItem(kind, parentId, subId, novoStatus){
  var hoje = todayISO();
  if(kind==="unica"){
    var s = STATE.saidasUnicas.find(function(x){return x.id===parentId;});
    if(s){ s.status=novoStatus; s.dataPagamento = novoStatus==="pago"?hoje:null; }
  } else if(kind==="parcelada"){
    var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});
    if(p){ var pc = p.parcelas.find(function(x){return x.numero===Number(subId);}); if(pc){ pc.status=novoStatus; pc.dataPagamento=novoStatus==="pago"?hoje:null; } }
  } else if(kind==="recorrente"){
    var r = STATE.saidasRecorrentes.find(function(x){return x.id===parentId;});
    if(r){ var o = r.ocorrencias.find(function(x){return x.mesAno===subId;}); if(o){ o.status=novoStatus; o.dataPagamento=novoStatus==="pago"?hoje:null; } }
  }
}
function cancelarFuturasParceladas(parentId, apartirNumero){
  var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});
  if(!p) return;
  p.parcelas.forEach(function(pc){ if(pc.numero>=apartirNumero && pc.status!=="pago") pc.status="cancelado"; });
}
function excluirSaidaItem(kind, parentId, subId){
  if(kind==="unica"){
    STATE.saidasUnicas = STATE.saidasUnicas.filter(function(x){return x.id!==parentId;});
  } else if(kind==="parcelada"){
    var p = STATE.saidasParceladas.find(function(x){return x.id===parentId;});
    if(!p) return;
    p.parcelas = p.parcelas.filter(function(pc){return pc.numero!==Number(subId);});
    if(p.parcelas.length===0){
      STATE.saidasParceladas = STATE.saidasParceladas.filter(function(x){return x.id!==parentId;});
    }
  } else if(kind==="recorrente"){
    var r = STATE.saidasRecorrentes.find(function(x){return x.id===parentId;});
    if(!r) return;
    r.ocorrencias = r.ocorrencias.filter(function(o){return o.mesAno!==subId;});
    if(!r.excluidas) r.excluidas = [];
    if(r.excluidas.indexOf(subId)===-1) r.excluidas.push(subId);
  }
}

function addEmprestimo(data){
  var tipoCobranca = data.tipoCobranca === "juros" ? "juros" : "parcelado";
  var dia = dayOf(data.primeiraDataPagamento);
  var mkInicial = monthKey(data.primeiraDataPagamento);

  if(tipoCobranca === "juros"){
    var jurosMensalVal = Math.round(data.valorOriginal * (data.juros/100) * 100)/100;
    var empJ = { id: uid("emp"), pessoaId:data.pessoaId, valorOriginal:data.valorOriginal, jurosPercent:data.juros,
      tipoCobranca:"juros", jurosMensal: jurosMensalVal, diaVencimento:dia, inicioMesAno:mkInicial,
      dataEmprestimo:data.dataEmprestimo, primeiraDataPagamento:data.primeiraDataPagamento,
      qtdParcelasJuros: data.qtdParcelasJuros || null, jurosExcluidas:[], jurosPausado:false,
      observacao:data.observacao||"", ativa:true, jurosOcorrencias:[], quitacao:null, status:"ativo", venda:null };
    STATE.emprestimos.push(empJ);
    ensureJurosEmprestimo(empJ);
    pushEvento("emprestimo", "Novo empréstimo (juros mensais) para "+pessoaNome(data.pessoaId), data.valorOriginal);
    return empJ;
  }

  var qtd = data.qtdParcelas || 1;
  var jurosModo = data.jurosModo === "mensal" ? "mensal" : "total";
  var mesesJuros = jurosModo === "mensal" ? qtd : 1;
  var jurosVal = data.valorOriginal * (data.juros/100) * mesesJuros;
  var total = data.valorOriginal + jurosVal;
  var valorParcelaBase = Math.round((total/qtd)*100)/100;
  var soma = 0, parcelas=[];
  for(var i=1;i<=qtd;i++){
    var v = (i===qtd) ? Math.round((total-soma)*100)/100 : valorParcelaBase;
    soma += v;
    parcelas.push({ numero:i, valor:v, vencimento: dateFromMesAnoDia(addMonthsToKey(mkInicial,i-1), dia), status:"pendente", dataPagamento:null });
  }
  var emp = { id: uid("emp"), pessoaId:data.pessoaId, valorOriginal:data.valorOriginal, jurosPercent:data.juros, jurosModo:jurosModo,
    tipoCobranca:"parcelado", valorJuros: Math.round(jurosVal*100)/100, valorTotal: Math.round(total*100)/100, dataEmprestimo:data.dataEmprestimo,
    qtdParcelas:qtd, frequencia:data.frequencia||"mensal", primeiraDataPagamento:data.primeiraDataPagamento,
    observacao:data.observacao||"", parcelas:parcelas, status:"ativo", venda:null };
  STATE.emprestimos.push(emp);
  pushEvento("emprestimo", "Novo empréstimo para "+pessoaNome(data.pessoaId), data.valorOriginal);
  return emp;
}
function pagarParcelaEmprestimo(empId, numero){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return;
  var p = e.parcelas.find(function(x){return x.numero===numero;});
  if(p){ p.status="pago"; p.dataPagamento=todayISO(); }
  if(e.parcelas.every(function(x){return x.status==="pago";})) e.status="quitado";
  pushEvento("recebimento", "Recebimento de "+pessoaNome(e.pessoaId)+" — parcela "+numero+"/"+e.qtdParcelas, p?p.valor:0);
}

function quitarEmprestimoJuros(empId, data){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return;
  var dataQ = data.data || todayISO();
  var mk = data.mesAno || monthKey(dataQ);
  var ocorrenciaMes = e.jurosOcorrencias.find(function(o){return o.mesAno===mk;});
  /* só entra na quitação o juro que ainda não tinha sido pago (evita contar em dobro) */
  var jurosIncluso = 0;
  if(ocorrenciaMes && ocorrenciaMes.status!=="pago"){ ocorrenciaMes.status="pago"; ocorrenciaMes.dataPagamento=dataQ; jurosIncluso = ocorrenciaMes.valor; }
  e.ativa = false;
  e.status = "quitado";
  e.quitacao = { data:dataQ, valorPrincipal:e.valorOriginal, valorJurosIncluso: jurosIncluso, observacao:data.observacao||"" };
  e.jurosOcorrencias = e.jurosOcorrencias.filter(function(o){ return o.status==="pago"; });
  pushEvento("quitacao", "Empréstimo de "+pessoaNome(e.pessoaId)+" quitado (principal"+(jurosIncluso?" + juros do mês":"")+")", e.valorOriginal + jurosIncluso);
}
function quitarEmprestimoParcelado(empId, dataQ){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return;
  dataQ = dataQ || todayISO();
  var soma = 0;
  e.parcelas.forEach(function(p){ if(p.status!=="pago" && p.status!=="cancelado"){ p.status="pago"; p.dataPagamento=dataQ; soma+=p.valor; } });
  e.status = "quitado";
  pushEvento("quitacao", "Empréstimo de "+pessoaNome(e.pessoaId)+" quitado (todas as parcelas)", soma);
}

  pushEvento("venda", "Venda de recebível de "+pessoaNome(e.pessoaId)+" para "+data.compradorNome, data.valorVenda);
}
function statusEmprestimo(e){
  if(e.status==="vendido") return "vendido";
  if(e.tipoCobranca==="juros"){
    if(e.status==="quitado") return "quitado";
    var hojeJ=todayISO();
    if(e.jurosOcorrencias.some(function(o){return o.status!=="pago" && o.vencimento<hojeJ;})) return "atrasado";
    var proximaJ = e.jurosOcorrencias.filter(function(o){return o.status!=="pago";}).sort(function(a,b){return cmpKey(a.vencimento,b.vencimento);})[0];
    if(proximaJ){ var diffJ=(new Date(proximaJ.vencimento)-new Date(hojeJ))/86400000; if(diffJ<=5) return "proximo"; }
    return "em_dia";
  }
  if(e.parcelas.every(function(p){return p.status==="pago";})) return "quitado";
  var hoje=todayISO();
  if(e.parcelas.some(function(p){return p.status!=="pago" && p.vencimento<hoje;})) return "atrasado";
  var proxima = e.parcelas.filter(function(p){return p.status!=="pago";}).sort(function(a,b){return cmpKey(a.vencimento,b.vencimento);})[0];
  if(proxima){ var diff=(new Date(proxima.vencimento)-new Date(hoje))/86400000; if(diff<=5) return "proximo"; }
  return "em_dia";
}
function restanteEmprestimo(e){
  if(e.status==="vendido") return 0;
  if(e.tipoCobranca==="juros"){
    /* principal + juros já vencidos até este mês (não soma os meses futuros que o app gera com antecedência) */
    var mkAt = currentMesAno();
    var s = e.jurosOcorrencias.filter(function(o){return o.status!=="pago" && cmpKey(o.mesAno,mkAt)<=0;}).reduce(function(a,o){return a+o.valor;},0);
    if(e.status!=="quitado") s += e.valorOriginal;
    return s;
  }
  return e.parcelas.filter(function(x){return x.status!=="pago" && x.status!=="cancelado";}).reduce(function(a,x){return a+x.valor;},0);
}
function recebidoEmprestimo(e){
  if(e.tipoCobranca==="juros"){
    var s = e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).reduce(function(a,o){return a+o.valor;},0);
    if(e.quitacao) s += e.quitacao.valorPrincipal;
    return s;
  }
  return e.parcelas.filter(function(x){return x.status==="pago";}).reduce(function(a,x){return a+x.valor;},0);
}
function jurosTotalEmprestimo(e){
  if(e.tipoCobranca==="juros"){
    return e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).reduce(function(a,o){return a+o.valor;},0);
  }
  return e.valorJuros;
}

var claudeArtifact = null;
var saveTimer = null;
var saveMode = "checking";

/* Aviso rápido: é colocado direto na tela, sem redesenhar o app
   (antes redesenhava tudo e apagava o que estava digitado nos formulários) */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("app-toast");
  if(!el){ el = document.createElement("div"); el.id = "app-toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.display = "";
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = "none"; }, 2200);
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 260);
}
function doSave(){
  try{ localStorage.setItem("financas-alif-state", JSON.stringify(STATE)); }catch(e){}
  if(claudeArtifact){
    claudeArtifact.publish(buildFullHTML(STATE)).then(function(){
      saveMode = "cloud";
    }).catch(function(err){
      if(err && (err.code==="not_writer" || err.code==="not_granted" || err.code==="not_declared")){
        saveMode = "local";
      } else if(err && err.code==="conflict"){
        /* shell recarrega a view */
      } else {
        saveMode = "local";
      }
      renderSaveBadge();
    });
  }
}
function renderSaveBadge(){
  var el = document.getElementById("save-badge");
  if(el) el.textContent = saveMode==="cloud" ? "☁️ Salvo" : (saveMode==="local" ? "💾 Salvo neste dispositivo" : "…");
}

var HEAD_HTML = null;
var OWN_SCRIPT_OUTER = null;
function buildFullHTML(state){
  var json = JSON.stringify(state).replace(/</g,"\\u003c").replace(/-->/g,"--\\u003e");
  var body = "<body>\n<div id=\"root\"></div>\n<script id=\"state-data\" type=\"application/json\">"+json+"<\/script>\n"+OWN_SCRIPT_OUTER+"\n</body>";
  return "<!doctype html>\n<html lang=\"pt-BR\">\n"+HEAD_HTML+"\n"+body+"\n</html>";
}

/* ============================== RENDER: SHELL ============================== */
function render(){
  var root = document.getElementById("root");
  var pageChanged = LAST_RENDER.page!==UI.page || LAST_RENDER.pessoaSel!==UI.pessoaSel;
  var modalChanged = LAST_RENDER.modal!==UI.modal;
  var confirmChanged = LAST_RENDER.confirm!==!!UI.confirm;
  var oldSheet = root.querySelector(".overlay:not(.confirm-ov) .sheet");
  var sheetScroll = (!modalChanged && oldSheet) ? oldSheet.scrollTop : 0;
  var winScroll = window.scrollY;
  root.innerHTML = renderShell(pageChanged);
  renderSaveBadge();
  if(pageChanged) window.scrollTo(0,0); else window.scrollTo(0,winScroll);
  if(!modalChanged){
    var ov = root.querySelector(".overlay:not(.confirm-ov)");
    if(ov){ ov.classList.add("noanim"); var sh = ov.querySelector(".sheet"); if(sh) sh.scrollTop = sheetScroll; }
  }
  if(!confirmChanged){ var cov = root.querySelector(".confirm-ov"); if(cov) cov.classList.add("noanim"); }
  LAST_RENDER = { page:UI.page, pessoaSel:UI.pessoaSel, modal:UI.modal, confirm:!!UI.confirm };
  if(UI.modal==="novo-emprestimo") Forms.updateJurosPreview();
  if(UI.modal==="simulador-juros") Forms.updateSimuladorPreview();
}

function renderShell(animar){
  var page = UI.page;
  var content = "";
  if(page==="dashboard") content = pageDashboard();
  else if(page==="entradas") content = pageEntradas();
  else if(page==="saidas") content = pageSaidas();
  else if(page==="emprestimos") content = pageEmprestimos();
  else if(page==="pessoa") content = pagePessoaDetalhe();
  else if(page==="historico") content = pageHistorico();
  else if(page==="planejamento") content = pagePlanejamento();
  else if(page==="calendario") content = pageCalendario();
  else if(page==="relatorios") content = pageRelatorios();
  else if(page==="perfil") content = pagePerfil();
  else content = pageDashboard();

  var html = '<div class="shell">'
    + topbar()
    + '<main'+(animar?' class="enter"':'')+'>'+content+'</main>'
    + tabbar()
    + (UI.modal ? modalWrap() : "")
    + (UI.confirm ? confirmWrap() : "")
    + '</div>';
  return html;
}

function confirmWrap(){
  var c = UI.confirm;
  if(!c) return "";
  return '<div class="overlay confirm-ov" style="z-index:55;" onclick="if(event.target===this)Actions.cancelarConfirmacao()"><div class="sheet" style="max-width:420px;">'
    + '<div class="sheet-handle"></div>'
    + '<h3>Confirmar</h3><div class="sheet-sub">'+esc(c.mensagem)+'</div>'
    + '<div class="btn-row" style="margin-top:14px;">'
    + '<button class="btn btn-secondary" onclick="Actions.cancelarConfirmacao()">Cancelar</button>'
    + '<button class="btn '+(c.positivo?"btn-success":"btn-danger")+'" onclick="Actions.confirmarAcaoPendente()">'+esc(c.label||"Confirmar")+'</button>'
    + '</div></div></div>';
}

    + '<div class="hero-mini" onclick="Modals.open(\'detalhe\',\'saidas-mes\')"><div class="t"><span class="dot" style="background:rgba(255,85,119,.18);color:#ff5577">'+ic("out")+'</span>Saídas</div><div class="v num">'+fmtBRL(r.saidas)+'</div></div>'
    + '</div></div>';
}
function donutCategoriasMes(mk){
  var porCat = {};
  todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && s.status!=="cancelado"; })
    .forEach(function(s){ porCat[s.categoria] = (porCat[s.categoria]||0) + s.valor; });
  var arr = Object.keys(porCat).map(function(k){ return {cat:k, v:porCat[k]}; }).sort(function(a,b){ return b.v-a.v; });
  if(!arr.length) return '<div class="empty">Nenhuma saída registrada neste mês.</div>';
  var top = arr.slice(0,5);
  if(arr.length>5){ top.push({cat:"__outras__", v:arr.slice(5).reduce(function(s,x){return s+x.v;},0)}); }
  var total = arr.reduce(function(s,x){return s+x.v;},0);
  var itens = top.map(function(x,i){
    var c = x.cat==="__outras__" ? {emoji:"", label:"Outras"} : catInfoSaida(x.cat);
    return { label:(c.emoji?c.emoji+" ":"")+c.label, valor:x.v, cor:CHART_PALETTE[i%CHART_PALETTE.length] };
  });
  return donutChart(itens, fmtCompactBRL(total), "no mês");
}
function fmtCompactBRL(n){ return (STATE.perfil.ocultarValores ? "R$ ••••" : "R$ "+fmtCompact(n)); }
function statCard(icone,label,value,cls,sub,onclick){

  var icHTML = ICONS[icone] ? ic(icone) : icone;
  return '<div class="stat '+(cls||"")+'"'+clickAttr+'><div class="label"><span class="ico">'+icHTML+'</span><span>'+esc(label)+'</span></div><div class="value num">'+value+'</div>'+(sub?'<div class="stat-sub num">'+sub+'</div>':'')+'</div>';

function calendarMiniHTML(mk){
  var p = mk.split("-").map(Number);
  var year = p[0], month = p[1];
  var firstDow = new Date(year, month-1, 1).getDay();
  var daysInMonth = new Date(year, month, 0).getDate();
  var hoje = todayISO();

  var dayInfo = {};
  todasSaidasFlat().forEach(function(s){ if(monthKey(s.vencimento)===mk && s.status!=="cancelado"){ var d=dayOf(s.vencimento); (dayInfo[d]=dayInfo[d]||{}).out=true; } });
  STATE.emprestimos.forEach(function(e){
    if(e.status==="vendido") return;
    if(e.tipoCobranca==="juros"){ e.jurosOcorrencias.forEach(function(o){ if(monthKey(o.vencimento)===mk && o.status!=="pago"){ var d=dayOf(o.vencimento); (dayInfo[d]=dayInfo[d]||{}).emp=true; } }); }
    else { e.parcelas.forEach(function(pc){ if(monthKey(pc.vencimento)===mk && pc.status!=="pago"){ var d=dayOf(pc.vencimento); (dayInfo[d]=dayInfo[d]||{}).emp=true; } }); }
  });
  compromissosDoMes(mk).forEach(function(c){ var d=dayOf(c.data); (dayInfo[d]=dayInfo[d]||{}).cmp=true; });

  var dow = ["D","S","T","Q","Q","S","S"];
  var html = '<div class="cal-grid">';
  dow.forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="cal-day empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = mk+"-"+pad(d);
    var info = dayInfo[d];
    var isToday = iso===hoje;
    html += '<div class="cal-day'+(isToday?" today":"")+'" onclick="Nav.calGoMes(\''+mk+'\')" title="'+fmtDate(iso)+'">'
      + '<span class="cal-num">'+d+'</span>';
    if(info){
      html += '<span class="cal-dots">'
        + (info.emp?'<i style="background:var(--accent-strong)"></i>':'')
        + (info.out?'<i style="background:var(--critical)"></i>':'')
        + (info.cmp?'<i style="background:var(--info)"></i>':'')
        + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* parte de juros de um item do calendário */
function jurosDoItem(it){
  if(it.tipo==="juros") return it.valor;
  var e = it.emp; var frac = e.valorTotal ? (e.valorJuros/e.valorTotal) : 0;
  return it.valor*frac;
}
function empCalendarGrid(mk, dias){
  var p = mk.split("-").map(Number);
  var firstDow = new Date(p[0], p[1]-1, 1).getDay();
  var daysInMonth = new Date(p[0], p[1], 0).getDate();
  var hoje = todayISO();
  var html = '<div class="cal-grid">';
  ["D","S","T","Q","Q","S","S"].forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="cal-day empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = mk+"-"+pad(d);
    var its = dias[iso] || [];
    var pend = its.filter(function(x){return !x.pago;});
    var late = pend.some(function(x){ return x.vencimento < hoje; });
    var cls = "cal-day"+(iso===hoje?" today":"");
    if(its.length){ cls += pend.length ? (late?" has-late":" has") : " has-paid"; }
    var soma = pend.reduce(function(s,x){ return s+jurosDoItem(x); },0);
    html += '<div class="'+cls+'"'+(its.length?' onclick="Modals.open(\'emp-dia\',\''+iso+'\')"':' style="cursor:default;"')+'>'
      + '<span class="cal-num">'+d+'</span>';
    if(its.length){
      html += pend.length ? '<span class="cal-amt">'+fmtCompact(soma)+'</span>'
        : '<span class="cal-dots"><i style="background:var(--accent-strong)"></i></span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
/* Folha do dia: juros do dia, total para quitar e botões de pago/quitou */
function sheetEmpDia(iso){
  var dias = empEventosDoMes(monthKey(iso));
  var its = dias[iso] || [];
  var hoje = todayISO();
  var html = '<h3>'+fmtDate(iso)+'</h3><div class="sheet-sub">'+(its.length ? its.length+' recebimento'+(its.length===1?"":"s")+' neste dia' : 'Nada para receber neste dia')+'</div>';
  its.forEach(function(it){
    var e = it.emp, nome = esc(pessoaNome(e.pessoaId));
    var jv = jurosDoItem(it);
    var quitado = e.status==="quitado";
    var totalQuitar = valorQuitarTudo(e, it.ref);
    var st = it.pago ? "pago" : (it.vencimento<hoje ? "atrasado" : (((new Date(it.vencimento)-new Date(hoje))/86400000)<=5 ? "proximo" : "pendente"));
    var refLabel = it.tipo==="juros" ? ("Juro de "+monthLabel(it.ref)) : ("Parcela "+it.ref+"/"+e.qtdParcelas);
    html += '<div class="dia-item">'
      + '<div class="di-top"><div class="avatar">'+esc(pessoaNome(e.pessoaId).slice(0,1).toUpperCase())+'</div>'
      + '<div class="info" style="cursor:pointer;" onclick="Modals.open(\'ver-emprestimo\',\''+e.id+'\')"><div class="title">'+nome+'</div><div class="meta">'+refLabel+' • emprestado '+fmtBRL(e.valorOriginal)+'</div></div>'
      + statusPill(st)+'</div>';
    html += '<div class="di-vals">'
      + '<div class="di-box"><div class="k">'+(it.tipo==="juros"?"Juros do mês":"Esta parcela")+'</div><div class="v num" style="color:var(--accent-strong)">'+fmtBRL(it.valor)+'</div>'
      + (it.tipo==="parcela" && jv>0 ? '<div class="k" style="margin-top:2px;">juros '+fmtBRL(jv)+'</div>' : '')+'</div>'
      + '<div class="di-box"><div class="k">Se pagar tudo</div><div class="v num">'+(quitado?"Quitado":fmtBRL(totalQuitar))+'</div>'

      + '</div>';
    html += '<div class="btn-row">';

      html += '<button class="btn btn-secondary" onclick="Actions.desfazerRecebimentoDia(\''+e.id+'\',\''+it.tipo+'\',\''+it.ref+'\')">Desfazer pagamento</button>';
    } else {
      html += '<button class="btn btn-success" onclick="Actions.pagarDoDia(\''+e.id+'\',\''+it.tipo+'\',\''+it.ref+'\')">'+ic("check")+(it.tipo==="juros"?" Juros pago":" Parcela paga")+'</button>';

      html += '<button class="btn btn-primary" onclick="Actions.quitarDoDia(\''+e.id+'\',\''+it.tipo+'\',\''+it.ref+'\')">Quitou tudo</button>';
    }
    html += '</div></div>';
  });
  if(!its.length) html += '<div class="empty">Nada por aqui.</div>';
  html += '<div class="btn-row" style="margin-top:6px;"><button class="btn btn-secondary" onclick="Modals.close()">Fechar</button></div>';

function anosDisponiveis(){
  var set = {};
  var y = new Date().getFullYear();
  set[y]=1; set[y-1]=1; set[y+1]=1;
  STATE.entradas.forEach(function(e){ set[parseInt(e.data.slice(0,4),10)]=1; });
  todasSaidasFlat().forEach(function(s){ set[parseInt(s.vencimento.slice(0,4),10)]=1; });
  return Object.keys(set).map(Number).sort();
}
function renderDetalheMes(mk){

/* ============================== CALENDÁRIO ============================== */
function eventosDoMes(mk){
  var eventos = {};
  STATE.entradas.filter(function(e){return monthKey(e.data)===mk;}).forEach(function(e){
    (eventos[e.data] = eventos[e.data]||[]).push({ic:"📥",t:esc(e.descricao||"Entrada"), v:fmtBRL(e.valor), pos:true});
  });
  todasSaidasFlat().filter(function(s){return monthKey(s.vencimento)===mk && s.status!=="cancelado";}).forEach(function(s){
    (eventos[s.vencimento] = eventos[s.vencimento]||[]).push({ic:"📤",t:esc(s.nome)+(s.parcelaLabel?" ("+s.parcelaLabel+")":""), v:fmtBRL(s.valor), pos:false});
  });
  STATE.emprestimos.forEach(function(e){
    if(e.status==="vendido") return;
    if(e.tipoCobranca==="juros"){
      e.jurosOcorrencias.forEach(function(o){ if(monthKey(o.vencimento)===mk && o.status!=="pago"){ (eventos[o.vencimento]=eventos[o.vencimento]||[]).push({ic:"🤝", t:"Juro de "+esc(pessoaNome(e.pessoaId)), v:fmtBRL(o.valor), pos:true}); } });
      return;
    }
    e.parcelas.forEach(function(p){ if(monthKey(p.vencimento)===mk && p.status!=="pago"){ (eventos[p.vencimento]=eventos[p.vencimento]||[]).push({ic:"🤝", t:"Receber de "+esc(pessoaNome(e.pessoaId)), v:fmtBRL(p.valor), pos:true}); } });
  });
  compromissosDoMes(mk).forEach(function(c){
    (eventos[c.data] = eventos[c.data]||[]).push({ic:"📌", t:esc(c.titulo), compromisso:true, id:c.id, hora:c.hora});
  });
  Object.keys(eventos).forEach(function(d){ eventos[d].sort(function(a,b){ return (a.hora||"99:99") < (b.hora||"99:99") ? -1 : 1; }); });
  return eventos;
}
function calendarGridHTML(mk, eventos){
  var p = mk.split("-").map(Number);
  var year = p[0], month = p[1];
  var firstDow = new Date(year, month-1, 1).getDay();
  var daysInMonth = new Date(year, month, 0).getDate();
  var hoje = todayISO();
  var dow = ["D","S","T","Q","Q","S","S"];
  var html = '<div class="cal-grid">';
  dow.forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="cal-day empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = mk+"-"+pad(d);
    var evs = eventos[iso];
    var isToday = iso===hoje;
    var temEvento = evs && evs.length>0;
    html += '<div class="cal-day'+(isToday?" today":"")+(temEvento?" has":"")+'"'
      + (temEvento ? ' onclick="Modals.open(\'ver-dia\',\''+iso+'\')" style="cursor:pointer;"' : ' style="cursor:default;"')
      + ' title="'+fmtDate(iso)+'"><span class="cal-num">'+d+'</span>';
    if(temEvento){
      var temEmp=false, temOut=false, temCmp=false;
      evs.forEach(function(ev){ if(ev.compromisso) temCmp=true; else if(ev.pos) temEmp=true; else temOut=true; });
      html += '<span class="cal-dots">'
        + (temEmp?'<i style="background:var(--accent-strong)"></i>':'')
        + (temOut?'<i style="background:var(--critical)"></i>':'')
        + (temCmp?'<i style="background:var(--info)"></i>':'')
        + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function sheetVerDia(iso){
  var mk = monthKey(iso);

  var evs = eventos[iso] || [];
  var html = '<h3>📅 '+fmtDate(iso)+'</h3><div class="sheet-sub">'+(evs.length ? evs.length+' evento'+(evs.length===1?"":"s")+' neste dia' : "Nenhum evento neste dia")+'</div>';
  html += '<div class="list" style="margin-bottom:12px;">';

    } else {
      html += '<div class="row" style="cursor:default;"><div class="emoji">'+ev.ic+'</div><div class="info"><div class="title">'+ev.t+'</div></div><div class="amt num" style="color:'+(ev.pos?"var(--accent-strong)":"var(--critical)")+';">'+(ev.pos?"+":"-")+ev.v+'</div></div>';
    }
  });
  if(!evs.length) html += '<div class="empty">Nada por aqui.</div>';

  html += '<div class="btn-row"><button class="btn btn-secondary" onclick="Modals.close()">Fechar</button></div>';
  return html;
}

function pageRelatorios(){
  ensureAllGenerated();
  var mkAtual = currentMesAno();
  var meses = [];
  for(var i=5;i>=0;i--) meses.push(addMonthsToKey(mkAtual,-i));
  var maxVal = 1;
  var dados = meses.map(function(mk){ var r=resumoMes(mk); maxVal=Math.max(maxVal,r.entradas,r.saidas); return {mk:mk,r:r}; });

  var html = "";
  html += '<div class="section card"><div class="card-title"><div><h2>Entradas x Saídas</h2><div class="cap">Últimos 6 meses • toque num mês</div></div></div>'
    + areaChart("relFlow", [
        {nome:"Entradas", cor:"#2ee6a6", valores:dados.map(function(d){return d.r.entradas;})},
        {nome:"Saídas", cor:"#ff5577", valores:dados.map(function(d){return d.r.saidas;})}
      ], dados.map(function(d){ return monthLabelShort(d.mk); }))
    + '</div>';
  html += '<div class="section card"><div class="card-title"><div><h2>Saldo mês a mês</h2><div class="cap">Verde sobrou • vermelho faltou</div></div></div>'
    + saldoBarChart(dados.map(function(d){return d.r.saldo;}), dados.map(function(d){ return monthLabelShort(d.mk); }))
    + '</div>';
  html += '<div class="section card"><div class="card-title"><div><h2>Gastos do mês</h2><div class="cap">'+monthLabel(mkAtual)+' por categoria</div></div></div>'
    + donutCategoriasMes(mkAtual) + '</div>';

  var porCategoria = {};
  todasSaidasFlat().filter(function(s){return s.status!=="cancelado";}).forEach(function(s){ porCategoria[s.categoria]=(porCategoria[s.categoria]||0)+s.valor; });
  var catArr = Object.keys(porCategoria).map(function(k){ return {cat:k, v:porCategoria[k]}; }).sort(function(a,b){return b.v-a.v;});
  var maxCat = catArr.length? catArr[0].v : 1;
  html += '<div class="section"><div class="card"><h2 style="margin-bottom:12px;">Gastos por categoria (total)</h2>';
  if(catArr.length===0) html += '<div class="empty">Sem despesas registradas.</div>';
  else{
    html += '<div class="barlist">';
    catArr.slice(0,10).forEach(function(x){
      var c = catInfoSaida(x.cat);
      var pct = Math.round((x.v/maxCat)*100);
      html += '<div><div class="bl-head"><span>'+c.emoji+' '+c.label+'</span><span class="num" style="font-weight:700">'+fmtBRL(x.v)+'</span></div><div class="bl-track"><div class="bl-fill" style="width:'+pct+'%"></div></div></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';

  html += '<div class="section"><div class="card"><h2 style="margin-bottom:4px;">Empréstimos</h2>';
  html += '<div class="kpi-line"><span>Total emprestado</span><span class="v num">'+fmtBRL(totalEmprestado())+'</span></div>';
  html += '<div class="kpi-line"><span>Total recebido em empréstimos</span><span class="v num">'+fmtBRL(totalRecebidoEmprestimos())+'</span></div>';
  html += '<div class="kpi-line"><span>Total de juros recebidos</span><span class="v num">'+fmtBRL(totalJurosRecebidos())+'</span></div>';
  html += '<div class="kpi-line"><span>Total a receber</span><span class="v num">'+fmtBRL(totalAReceberEmprestimos())+'</span></div>';
  var atrasados = STATE.emprestimos.filter(function(e){return statusEmprestimo(e)==="atrasado";}).length;
  html += '<div class="kpi-line"><span>Empréstimos atrasados</span><span class="v num">'+atrasados+'</span></div>';
  html += '<div class="kpi-line"><span>Valores vendidos/transferidos</span><span class="v num">'+fmtBRL(totalVendido())+'</span></div>';
  html += '</div></div>';
  return html;
}

    total = itens.reduce(function(s,x){return s+x.valor;},0);

    if(!itens.length) rows = '<div class="empty">Nenhuma despesa futura este mês.</div>';
  } else if(tipo==="entradas-mes"){
    titulo = "📈 Entradas do mês"; sub = "Entradas registradas em "+monthLabel(mk)+".";
    var itensE = STATE.entradas.filter(function(e){ return monthKey(e.data)===mk; });
    total = somaEntradasMes(mk);
    itensE.forEach(function(e){ rows += entradaRow(e); });
    if(!itensE.length) rows = '<div class="empty">Nenhuma entrada este mês.</div>';
  } else if(tipo==="saidas-mes"){
    titulo = "📉 Saídas do mês"; sub = "Saídas com vencimento em "+monthLabel(mk)+".";
    var itensS = todasSaidasFlat().filter(function(s){ return monthKey(s.vencimento)===mk && s.status!=="cancelado"; });
    total = somaSaidasMes(mk);
    itensS.forEach(function(s){ rows += saidaRow(s); });
    if(!itensS.length) rows = '<div class="empty">Nenhuma saída este mês.</div>';
  } else if(tipo==="a-receber"){
    titulo = "🤝 Juros a receber (mês)"; sub = "Juros de "+monthLabel(mk)+" ainda não recebidos.";
    var itensAR = itensJurosAReceberMes(mk);
    total = jurosAReceberMes(mk);
    itensAR.forEach(function(v){ rows += emprestimoVencRow({emp:v.emp, vencimento:v.vencimento, valor:v.valor, label:v.label}); });
    if(!itensAR.length) rows = '<div class="empty">Nenhum juro pendente este mês.</div>';
  } else if(tipo==="a-receber-total"){
    titulo = "🤝 A receber"; sub = "Tudo que ainda falta receber de empréstimos: parcelas e juros pendentes, com nome, dia e valor.";
    var itensART = itensAReceberTodosEmprestimos();
    total = totalAReceberEmprestimos();
    itensART.forEach(function(v){ rows += emprestimoVencRow(v); });
    if(!itensART.length) rows = '<div class="empty">Nada a receber no momento.</div>';
  } else if(tipo==="juros-recebidos-total"){
    titulo = "📈 Juros recebidos"; sub = "Todo juro já recebido de empréstimos, com nome, dia e valor.";
    var itensJRT = itensJurosRecebidosTodos();
    total = totalJurosRecebidos();
    itensJRT.forEach(function(v){ rows += emprestimoVencRow(v); });
    if(!itensJRT.length) rows = '<div class="empty">Nenhum juro recebido ainda.</div>';
  } else if(tipo==="ja-recebido"){
    titulo = "✅ Já recebido"; sub = "Total histórico já recebido de empréstimos (juros e principal).";
    total = totalRecebidoEmprestimos();
    STATE.emprestimos.forEach(function(e){
      if(e.tipoCobranca==="juros"){
        e.jurosOcorrencias.filter(function(o){return o.status==="pago";}).forEach(function(o){ rows += emprestimoVencRow({emp:e, vencimento:o.dataPagamento||o.vencimento, valor:o.valor, label:"Juro de "+monthLabel(o.mesAno)}); });
        if(e.quitacao) rows += emprestimoVencRow({emp:e, vencimento:e.quitacao.data, valor:e.quitacao.valorPrincipal, label:"Principal quitado"});
      } else {
        e.parcelas.filter(function(p){return p.status==="pago";}).forEach(function(p){ rows += emprestimoVencRow({emp:e, vencimento:p.dataPagamento||p.vencimento, valor:p.valor, label:"Parcela "+p.numero+"/"+e.qtdParcelas}); });
      }
    });
    if(!rows) rows = '<div class="empty">Nada recebido ainda.</div>';
  } else if(tipo==="juros-recebido"){
    titulo = "📈 Juros recebidos (mês)"; sub = "Juros efetivamente recebidos em "+monthLabel(mk)+".";
    var itensJR = itensJurosRecebidoMes(mk);
    total = jurosRecebidoMes(mk);
    itensJR.forEach(function(v){ rows += emprestimoVencRow({emp:v.emp, vencimento:v.data, valor:v.valor, label:v.label}); });
    if(!itensJR.length) rows = '<div class="empty">Nenhum juro recebido este mês.</div>';
  } else if(tipo==="vence-7-dias"){
    titulo = "📅 Vencendo em 7 dias"; sub = "Parcelas e juros de empréstimo com vencimento nos próximos 7 dias.";
    var itensV = proximosVencimentosEmprestimo(7);
    total = itensV.reduce(function(s,v){return s+v.valor;},0);
    itensV.forEach(function(v){ rows += emprestimoVencRow(v); });
    if(!itensV.length) rows = '<div class="empty">Nada vencendo nos próximos 7 dias.</div>';
  } else {
    return "";
  }
  return '<h3>'+titulo+'</h3><div class="sheet-sub">'+sub+'</div>'
    + '<div class="card" style="margin-bottom:12px;"><div class="kpi-line"><span>Total</span><span class="v num">'+fmtBRL(total)+'</span></div></div>'
    + '<div class="list" style="margin-bottom:12px;">'+rows+'</div>'
    + '<div class="btn-row"><button class="btn btn-secondary" onclick="Modals.close()">Fechar</button></div>';
}

  html += '<div class="btn-row" style="margin-bottom:8px;"><button class="btn btn-danger" onclick="Actions.excluirTodasParcelasEmp(\''+e.id+'\')">Excluir todas as parcelas</button></div>';
  if(e.status!=="vendido" && e.status!=="quitado"){
    html += '<div class="btn-row"><button class="btn btn-secondary" onclick="Modals.open(\'vender-recebivel\',\''+e.id+'\')">Vender/Transferir este recebível</button></div>';

  html += '<div class="btn-row" style="margin-top:8px;"><button class="btn btn-secondary" onclick="Modals.close()">Fechar</button></div>';

}
function sheetQuitarEmprestimo(empId){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});
  if(!e) return "";
  var hoje = todayISO();
  var mk = monthKey(hoje);
  var ocorrenciaMes = e.jurosOcorrencias.find(function(o){return o.mesAno===mk;});
  var jurosIncluso = (ocorrenciaMes && ocorrenciaMes.status!=="pago") ? ocorrenciaMes.valor : 0;
  return '<h3>✅ Quitar empréstimo</h3><div class="sheet-sub">'+esc(pessoaNome(e.pessoaId))+' devolve o principal</div>'
    + '<div class="card" style="margin-bottom:12px;">'
    + '<div class="kpi-line"><span>Principal</span><span class="v num">'+fmtBRL(e.valorOriginal)+'</span></div>'
    + (jurosIncluso>0 ? '<div class="kpi-line"><span>+ Juro do mês</span><span class="v num">'+fmtBRL(jurosIncluso)+'</span></div>' : '')
    + '<div class="kpi-line"><span>Total recebido nessa quitação</span><span class="v num">'+fmtBRL(e.valorOriginal+jurosIncluso)+'</span></div>'
    + '</div>'
    + '<div class="field"><label>Data da quitação</label><input id="f_data_quitacao" type="date" value="'+hoje+'"></div>'
    + '<div class="field"><label>Observações</label><textarea id="f_obs_quitacao"></textarea></div>'
    + '<div class="btn-row"><button class="btn btn-secondary" onclick="Modals.close()">Cancelar</button>'
    + '<button class="btn btn-primary" onclick="Actions.quitarEmprestimoJuros(\''+e.id+'\')">Confirmar quitação</button></div>';
}
function sheetVenderRecebivel(empId){
  var e = STATE.emprestimos.find(function(x){return x.id===empId;});

  var restante = e.parcelas.filter(function(p){return p.status!=="pago";}).reduce(function(s,p){return s+p.valor;},0);
  return '<h3>🔄 Vender/Transferir recebível</h3><div class="sheet-sub">'+esc(pessoaNome(e.pessoaId))+' deve '+fmtBRL(restante)+'</div>'
    + '<div class="form-scroll">'

    + '<div class="field-row"><div class="field"><label>Valor da venda (R$)</label><input id="f_valor_venda" type="number" step="0.01" placeholder="0,00"></div>'
    + '<div class="field"><label>Data</label><input id="f_data_venda" type="date" value="'+todayISO()+'"></div></div>'
    + '<div class="field"><label>Observações</label><textarea id="f_obs_venda"></textarea></div>'

}

window.Actions = {
  setTipoSaida: function(btn, tipo){

  },
  salvarEntrada: function(){
    var cat = document.getElementById("f_cat").value || "outros";
    var desc = document.getElementById("f_desc").value.trim();
    var valor = parseFloat(document.getElementById("f_valor").value);
    var data = document.getElementById("f_data").value || todayISO();
    var obs = document.getElementById("f_obs").value.trim();
    var rec = document.getElementById("f_recorrente").checked;
    if(!valor || valor<=0){ showToast("Informe um valor válido."); return; }
    if(rec){
      salvarRendaFixa({descricao:desc||"Salário", valor:valor, dia:dayOf(data)}, "todas");
    } else {
      addEntrada({categoria:cat, descricao:desc, valor:valor, data:data, observacao:obs});
    }
    Modals.close(); scheduleSave(); showToast("Entrada salva ✓");
  },
  excluirEntrada: function(id){
    var e = STATE.entradas.find(function(x){return x.id===id;});
    if(e && e.origem==="fixa" && STATE.rendaFixa && STATE.rendaFixa.id===e.rendaFixaId){
      if(!STATE.rendaFixa.excluidas) STATE.rendaFixa.excluidas = [];
      if(STATE.rendaFixa.excluidas.indexOf(e.mesAno)===-1) STATE.rendaFixa.excluidas.push(e.mesAno);

    STATE.entradas = STATE.entradas.filter(function(x){return x.id!==id;});
    Modals.close(); scheduleSave(); showToast("Entrada excluída");
  },
